<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاب - جهان ویدیو</title>

<style>
/* ===== FONT (Base64) ===== */
@font-face{
  font-family:Qab;
  src:url(data:font/woff2;base64,XXXX) format("woff2");
  font-weight:400;
}
@font-face{
  font-family:Qab;
  src:url(data:font/woff2;base64,YYYY) format("woff2");
  font-weight:700;
}

body{
  margin:0;
  font-family:Qab,sans-serif;
  background:#0f0f0f;
  color:#eaeaea;
}

/* ===== Skeleton Animation (کند و روان) ===== */
@keyframes shimmer{
  0%{background-position:100% 0;}
  100%{background-position:-100% 0;}
}

.skel{
  position:absolute;
  inset:0;
  background: linear-gradient(
    90deg,
    #1c1c1c 25%,
    #2a2a2a 37%,
    #1c1c1c 63%
  );
  background-size:400% 100%;
  animation:shimmer 2.4s linear 1;
  border-radius:4px;
  pointer-events:none;
}

/* ===== Header ===== */
.header{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:#141414;
  border-bottom:1px solid #222;
}

.logo img{height:24px;}

.search{
  flex:1;
  background:#1f1f1f;
  padding:8px 12px;
  border-radius:10px;
  font-weight:400;
  color:#aaa;
}

/* ===== Category / Title ===== */
.category-title{
  padding:0 20px;
  margin:20px 0 12px 0;
}

.category-title .title-wrap{
  position:relative;
  height:24px;
  width:200px;
}

.title-text{
  font-size:20px;
  font-weight:700;
  color:#eaeaea;
}

.skel-active .title-text{
  color:transparent;
}

.category-title .text-skel{
  position:absolute;
  inset:0;
  border-radius:4px;
  z-index:2;
}

/* ===== Videos Grid ===== */
.container{padding:0 20px 20px;}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

/* ===== Card ===== */
.card{
  background:#141414;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

/* ===== Thumb ===== */
.thumb{
  position:relative;
  height:160px;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.thumb .skel{border-radius:14px 14px 0 0;}

.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:#ffbe00;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
  font-weight:700;
}

/* ===== Info ===== */
.info{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.title-wrap,
.channel-wrap{
  position:relative;
}

.title{
  font-size:14px;
  font-weight:700;
}

.channel{
  font-size:12px;
  color:#999;
  font-weight:400;
}

.text-skel{
  position:absolute;
  inset:0;
  border-radius:4px;
  pointer-events:none;
}
.skel-active .title,
.skel-active .channel{
  color:transparent;
}

</style>
</head>

<body class="skel-active">

<header class="header">
  <div class="logo">
    <img src="image/logo.png">
  </div>
  <div class="search">جستجوی ویدیو</div>
</header>

<!-- ===== Category Title ===== -->
<div class="category-title">
  <div class="title-wrap">
    <span class="title-text">ویژه</span>
    <div class="text-skel skel"></div>
  </div>
</div>

<div class="container">
  <div class="videos">

    <!-- CARD 1 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?1">
        <span class="time">20:31</span>
        <div class="skel"></div>
      </div>

      <div class="info">
        <div class="title-wrap">
          <div class="title">سونیک کالرز آلتیمیت با مود</div>
          <div class="text-skel skel"></div>
        </div>

        <div class="channel-wrap">
          <div class="channel">Neo Charmy · 34 بازدید</div>
          <div class="text-skel skel"></div>
        </div>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?2">
        <span class="time">00:09</span>
        <div class="skel"></div>
      </div>

      <div class="info">
        <div class="title-wrap">
          <div class="title">رانش زمین در جاده ایذه</div>
          <div class="text-skel skel"></div>
        </div>

        <div class="channel-wrap">
          <div class="channel">عصر ایران · 796 بازدید</div>
          <div class="text-skel skel"></div>
        </div>
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?3">
        <span class="time">11:26</span>
        <div class="skel"></div>
      </div>

      <div class="info">
        <div class="title-wrap">
          <div class="title">ارائه خانم زهرا محمدی</div>
          <div class="text-skel skel"></div>
        </div>

        <div class="channel-wrap">
          <div class="channel">کانال رسمی · 1 بازدید</div>
          <div class="text-skel skel"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
setTimeout(()=>{
  document.body.classList.remove("skel-active");
},2400); /* دقیقاً پایان دور کند اسکلت */
</script>

</body>
</html>
