<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aparat Mock</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
}

/* ===== Header ===== */
.header{
  height:64px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  border-bottom:1px solid #e5e5e5;
}

.logo img{height:32px;}

.search{
  flex:1;
  background:#f1f1f1;
  border-radius:10px;
  padding:8px 12px;
  color:#999;
  font-size:14px;
}

.actions{display:flex;gap:10px;}
.btn{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:6px 10px;
  cursor:pointer;
}

/* ===== Videos ===== */
.container{
  padding:20px;
}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

.card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

.thumb{
  position:relative;
}

.thumb img{
  width:100%;
  display:block;
}

.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
}

.info{
  padding:10px;
}

.title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px;
}

.channel{
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<!-- ===== Header ===== -->
<header class="header">
  <div class="logo">
    <img src="image/logo.png""
  </div>

  <div class="search">جستجوی ویدیو در آپارات</div>

  <div class="actions">
    <button class="btn">بارگذاری ویدیو</button>
    <button class="btn">🔔</button>
    <button class="btn">☰</button>
  </div>
</header>

<!-- ===== Videos ===== -->
<div class="container">
  <div class="videos">

    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?1">
        <span class="time">20:31</span>
      </div>
      <div class="info">
        <div class="title">سونیک کالرز آلتیمیت با مود</div>
        <div class="channel">Neo Charmy · 34 بازدید</div>
      </div>
    </div>

    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?2">
        <span class="time">00:09</span>
      </div>
      <div class="info">
        <div class="title">رانش زمین در جاده ایذه</div>
        <div class="channel">عصر ایران · 796 بازدید</div>
      </div>
    </div>

    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?3">
        <span class="time">11:26</span>
      </div>
      <div class="info">
        <div class="title">ارائه خانم زهرا محمدی</div>
        <div class="channel">کانال رسمی · 1 بازدید</div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
