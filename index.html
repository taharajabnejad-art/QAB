<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT (Base64) ================= */
@font-face {
  font-family: "Ravi";
  font-weight: 700;
  src: url(data:font/woff2;base64,PUT_RAVI_BOLD_BASE64_HERE) format("woff2");
}
@font-face {
  font-family: "Ravi";
  font-weight: 400;
  src: url(data:font/woff2;base64,PUT_RAVI_REGULAR_BASE64_HERE) format("woff2");
}

/* ================= RESET ================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Ravi", sans-serif;
  background: #0d0d0d;
  color: #fff;
  overflow-x: hidden;
}

/* ================= HERO ================= */
.hero {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}

/* نئون کناره‌ها */
.hero::before,
.hero::after {
  content: "";
  position: absolute;
  top: 0;
  width: 240px;
  height: 100%;
  filter: blur(130px);
  opacity: 0.35;
}

.hero::before {
  left: -120px;
  background: #ffbe00;
}

.hero::after {
  right: -120px;
  background: #ff006a;
}

/* ================= HERO CONTENT ================= */
.hero-text {
  position: relative;
  z-index: 2;
  text-align: center;
}

/* ================= SKELETON ================= */
.skeleton {
  position: relative;
  overflow: hidden;
  background: #1f1f1f;
  border-radius: 8px;
}

/* shimmer حرکتی داخلی */
.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,0.28) 50%,
    transparent 100%
  );
  animation: shimmer 1.6s infinite;
}

@keyframes shimmer {
  100% {
    transform: translateX(100%);
  }
}

/* ================= TEXT SKELETON SIZES ================= */
.hero-title-skeleton {
  width: 340px;
  height: 48px;
  margin: 0 auto 16px;
}

.hero-desc-skeleton {
  width: 280px;
  height: 20px;
  margin: 0 auto;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-text">
    <!-- داستان جهان ویدئو -->
    <div class="skeleton hero-title-skeleton"></div>

    <!-- جایی برای تجربه و اشتراک ویدئوها -->
    <div class="skeleton hero-desc-skeleton"></div>
  </div>
</section>

</body>
</html>
