*{box-sizing:border-box}
body{margin:0;font-family:Qab,sans-serif;background:#0f0f0f;color:#eaeaea;}

/* ===== HEADER ===== */
.header{
  position:fixed;
  top:0;
  width:100%;
  height:80px;
  background:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.6) 55%, rgba(0,0,0,0) 100%);
  z-index:1000;
}

/* لوگو دقیق وسط */
.logo-center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  gap:8px;
}
.logo-center img{height:32px;}
.logo-center span{font-size:20px;font-weight:700;color:#fff;}

/* آواتار چپ */
.header-left{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
}
.profile-btn{
  width:36px;
  height:36px;
  border-radius:12px;
  background:#1c1c1c;
  display:flex;
  align-items:center;
  justify-content:center;
}
.profile-btn img{
  width:20px;
  height:20px;
  display:block;
}

/* ===== SPACER ===== */
.spacer{height:80px;}

/* ===== CONTAINER ===== */
.container{padding:16px;}
.section-title{font-size:18px;font-weight:700;margin:8px 0 16px;}

/* ===== GRID ===== */
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}

/* ===== CARD کوتاه ===== */
.card{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  background:#141414;
}

/* تصویر */
.thumb{
  position:relative;
  aspect-ratio:16/9;
  z-index:0;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* گرانیت ثابت روی عکس */
.thumb::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.35), rgba(0,0,0,0));
  pointer-events:none;
  z-index:1;
}

/* متن و کانال روی گرانیت سمت راست */
.info{
  position:absolute;
  bottom:10px;
  right:10px; /* راست‌چین */
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:4px;
  color:#fff;
  text-align:right; /* متن راست‌چین */
}

.title{font-size:14px;font-weight:700;}
.channel{font-size:12px;color:#fff;}
  
/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  .header{height:64px;}
  .spacer{height:64px;}
}
</style>
