<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg, #FFBE00 0%, transparent 45%),
    #0d0d0d;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:10px 20px;
  z-index:2;
  display:flex;
  align-items:center;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

/* ================= HERO TEXT ================= */
.hero-text {
  text-align:center;
  margin-top:140px;
}

.hero-text h1 {
  font-size:36px;
  font-weight:700;
}

.hero-text p {
  margin-top:12px;
  font-size:16px;
  opacity:0.85;
}

/* ================= CTA ================= */
.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  margin-top:24px;
  display:inline-block;
  text-decoration:none;
}

/* ================= SKELETON ================= */
.hero-skeleton {
  position:absolute;
  inset:0;
  background:#1a1a1a;
  border-radius:12px;
  overflow:hidden;
  z-index:10;
}

.hero-skeleton::after {
  content:"";
  position:absolute;
  top:0;
  left:-150%;
  width:50%;
  height:100%;
  background:linear-gradient(110deg, transparent 0%, rgba(255,255,255,.18) 45%, rgba(255,255,255,.28) 50%, rgba(255,255,255,.18) 55%, transparent 100%);
  animation: skeleton-shine 1.2s linear infinite;
}

@keyframes skeleton-shine {
  to { left:150%; }
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a href="#" class="cta-button">داستان خودتو بنویس</a>
  </div>

  <!-- Skeleton روی کل Hero -->
  <div class="hero-skeleton"></div>
</section>

<script>
const skeleton = document.querySelector('.hero-skeleton');
let moves = 0;

// 3 بار shimmer بعد حذف Skeleton
const interval = setInterval(() => {
  moves++;
  if(moves >= 3){
    skeleton.remove();
    clearInterval(interval);
  }
}, 1200); // هر بار حرکت 1.2 ثانیه
</script>

</body>
</html>
