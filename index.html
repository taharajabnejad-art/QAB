<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= SKELETON ================= */
.skeleton {
  position: relative;
  background: #1a1a1a;
  overflow: hidden;
  border-radius: 10px;
}

.skeleton::after {
  content: "";
  position: absolute;
  top: 0;
  left: -140%;
  width: 55%;
  height: 100%;
  background: linear-gradient(
    110deg,
    transparent 0%,
    rgba(255,255,255,.18) 45%,
    rgba(255,255,255,.28) 50%,
    rgba(255,255,255,.18) 55%,
    transparent 100%
  );
  animation: skeleton-shine 1.2s linear 0s infinite;
}

@keyframes skeleton-shine {
  0%   { left: -140%; }
  20%  { left: -70%; }
  40%  { left: 0%; }
  60%  { left: 70%; }
  80%  { left: 140%; }
  100% { left: -140%; }
}

.skeleton.loaded { background: transparent; }
.skeleton.loaded::after { display:none; }

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg, #FFBE00 0%, transparent 45%),
    #0d0d0d;
  position:relative;
}

.hero-header-bg {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:80px;
  background:linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
  pointer-events:none;
  z-index:1;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:10px 20px;
  z-index:2;
  display:flex;
  align-items:center;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px; height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter: drop-shadow(0 0 5px #FFBE00);
}

/* ================= HERO TEXT ================= */
.hero-text {
  margin-top:140px;
  text-align:center;
}

.hero-title-s, .hero-desc-s {
  width:70%;
  height:42px;
  margin:0 auto 16px;
  border-radius:8px;
}

.hero-desc-s { width:55%; height:18px; }

.hero-title, .hero-desc {
  visibility:hidden; /* متن واقعی مخفی تا Skeleton کامل باشه */
  margin:0 auto 16px;
}

/* ================= CTA ================= */
.cta-button-s {
  width:180px; height:40px;
  margin:32px auto 0;
  border-radius:6px;
  background:#FFBE00;
}

.cta-button {
  display:block;
  visibility:hidden; /* متن واقعی مخفی تا Skeleton لود بشه */
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  margin-top:32px;
  text-decoration:none;
}

/* ================= SUGGESTIONS ================= */
.section { padding:24px 16px; }

.section-title {
  font-size:18px;
  font-weight:600;
  margin-bottom:16px;
}

.suggestions {
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
}

.video-card {
  width:200px;
}

.thumb-s {
  width:100%;
  aspect-ratio:16/9;
  border-radius:8px;
}

.thumb, .line, .line.small {
  visibility:hidden; /* متن واقعی بعد از Skeleton */
}

.line { height:14px; margin-bottom:6px; }
.line.small { width:60%; }
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-bg"></div>

  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <div class="hero-text">
    <!-- Skeleton -->
    <div class="skeleton hero-title-s"></div>
    <div class="skeleton hero-desc-s"></div>
    <div class="skeleton cta-button-s"></div>

    <!-- Real content -->
    <h1 class="hero-title">داستانت رو پیدا کن</h1>
    <p class="hero-desc">قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a class="cta-button" href="#">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>
  <div class="suggestions">
    <div class="video-card">
      <div class="thumb-s skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
      <img class="thumb" src="#" alt="ویدئو ۱">
      <div class="line">عنوان ویدئو ۱</div>
      <div class="line small"></div>
    </div>

    <div class="video-card">
      <div class="thumb-s skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
      <img class="thumb" src="#" alt="ویدئو ۲">
      <div class="line">عنوان ویدئو ۲</div>
      <div class="line small"></div>
    </div>

    <div class="video-card">
      <div class="thumb-s skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
      <img class="thumb" src="#" alt="ویدئو ۳">
      <div class="line">عنوان ویدئو ۳</div>
      <div class="line small"></div>
    </div>
  </div>
</section>

<script>
window.addEventListener('load', () => {
  const skeletons = document.querySelectorAll('.skeleton');
  const reals = document.querySelectorAll('.hero-title, .hero-desc, .cta-button, .thumb, .line, .line.small');

  let step = 0;
  const steps = 5; // تعداد حرکت
  const interval = 140; // هر حرکت 140ms (5 حرکت تقریبا 700ms)

  const animateSkeleton = setInterval(() => {
    step++;
    if(step >= steps) {
      skeletons.forEach(s => s.classList.add('loaded'));
      reals.forEach(r => r.style.visibility = 'visible');
      clearInterval(animateSkeleton);
    }
  }, interval);
});
</script>

</body>
</html>
