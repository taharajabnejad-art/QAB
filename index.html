<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
  overflow-x:hidden;
}

/* ================= LOADING ================= */
#loading {
  position:fixed;
  inset:0;
  background:#0d0d0d;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  transition: opacity 1.2s ease;
}

.loader {
  width:64px;
  height:64px;
  border:4px solid rgba(255,255,255,0.15);
  border-top-color:#FFBE00;
  border-radius:50%;
  animation: spin 1.1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg, #FFBE00 0%, transparent 45%),
    #0d0d0d;
  display:flex;
  flex-direction:column;
  position:relative;
}

.hero-header-bg {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:80px;
  background:linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
  pointer-events:none;
  z-index:1;
}

.hero-header-fixed {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:10px 20px;
  display:flex;
  align-items:center;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

.hero-text {
  margin-top:140px;
  text-align:center;
}

.hero-text h1 {
  font-size:36px;
  font-weight:700;
}

.hero-text p {
  margin-top:12px;
  font-size:16px;
  opacity:0.85;
}

.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:24px;
  display:inline-block;
  text-decoration:none;
}

/* ================= SUGGESTIONS ================= */
.section { padding:16px 14px 32px; }
.section-title { margin:16px 6px; font-size:18px; font-weight:600; }

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div class="loader"></div>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-header-bg"></div>

  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a href="#" class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<script>
window.addEventListener('load', () => {
  const loading = document.getElementById('loading');

  setTimeout(() => {
    loading.style.opacity = '0';
    setTimeout(() => loading.remove(), 1200);
  }, 1800); // ⏱️ مدت نمایش لودینگ
});
</script>

</body>
</html>
