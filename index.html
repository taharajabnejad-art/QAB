body{
  margin:0;
  font-family:Qab,sans-serif;
  background:#0f0f0f;
  color:#eaeaea;
}

/* ===== Skeleton Overlay ===== */
.skel{
  position:absolute;
  inset:0;
  background: linear-gradient(
    90deg,
    #1c1c1c 25%,
    #2a2a2a 50%,
    #1c1c1c 75%
  );
  background-size: 200% 100%;  /* 👈 مهم */
  animation:shimmer 1.2s ease-in-out 1; /* 👈 فقط یک بار */
  pointer-events:none;
  z-index:2;
  border-radius:6px;
}

@keyframes shimmer{
  0%{background-position:100% 0;}
  100%{background-position:-100% 0;}
}

.loaded .skel{display:none;}

/* ===== Header ===== */
.header{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:#141414;
  border-bottom:1px solid #222;
  border-radius:6px; /* گوشه نرم */
}

.logo img{height:24px;}

.search{
  flex:1;
  background:#1f1f1f;
  padding:8px 12px;
  border-radius:10px;
  font-weight:400;
  color:#aaa;
}

/* ===== Grid ===== */
.container{padding:20px;}
.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

/* ===== Card ===== */
.card{
  background:#141414;
  border-radius:14px; /* گوشه نرم کارت */
  overflow:hidden;
  position:relative;
}

/* ===== Thumb ===== */
.thumb{
  position:relative;
  height:160px;
  border-radius:10px; /* گوشه نرم عکس */
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:10px;
}

.thumb .skel{border-radius:10px;}

.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:#ffbe00;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
  font-weight:700;
  z-index:3;
}

/* ===== Info ===== */
.info{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
}

.title-wrap,
.channel-wrap{
  position:relative;
}

/* متن واقعی */
.title{
  font-size:14px;
  font-weight:700;
  color:#0f0f0f; /* بی‌رنگ هنگام اسکلت */
  z-index:1;
  border-radius:4px; /* گوشه متن نرم */
}

.channel{
  font-size:12px;
  color:#0f0f0f; /* بی‌رنگ هنگام اسکلت */
  font-weight:400;
  z-index:1;
  border-radius:4px; /* گوشه متن نرم */
}

/* اسکلت متن */
.text-skel{
  position:absolute;
  inset:0;
  border-radius:4px; /* گوشه اسکلت متن نرم */
  z-index:2; /* بالاتر از متن */
}

.title-wrap{height:14px;width:90%;}
.channel-wrap{height:12px;width:60%;}

/* وقتی اسکلت تموم شد متن رنگ واقعی می‌گیرد */
.loaded .title{color:#eaeaea;}
.loaded .channel{color:#999;}
</style>
</head>
