<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاب – جهان ویدیو</title>

<style>
/* ===== FONT (Base64) ===== */
@font-face{
  font-family:Qab;
  src:url(data:font/woff2;base64,XXXX) format("woff2");
  font-weight:400;
}
@font-face{
  font-family:Qab;
  src:url(data:font/woff2;base64,YYYY) format("woff2");
  font-weight:700;
}

body{
  margin:0;
  font-family:Qab,sans-serif;
  background:#0f0f0f;
  color:#eaeaea;
}

/* ===== HEADER ===== */
.header{
  position:fixed;
  top:0;
  width:100%;
  height:80px;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,1) 0%,
    rgba(0,0,0,.7) 35%,
    rgba(0,0,0,.3) 65%,
    rgba(0,0,0,0) 100%
  );
  z-index:1000;
}

.logo-center{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo-center img{height:32px;}
.logo-center .logo-text{
  font-weight:700;
  font-size:20px;
  color:#fff;
}

/* ===== SPACER ===== */
.spacer{height:80px;}

/* ===== Videos Grid ===== */
.container{padding:20px;}
.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

/* ===== Card ===== */
.card{
  background:#141414;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

/* ===== Thumb ===== */
.thumb{
  position:relative;
  height:160px;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== Skeleton on Image ===== */
.thumb::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#1c1c1c 25%,#2a2a2a 37%,#1c1c1c 63%);
  background-size:400% 100%;
  animation:shimmer 1.6s linear 1;
  pointer-events:none;
  z-index:2;
  border-radius:14px 14px 0 0;
}

/* ===== Info ===== */
.info{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
  z-index:1;
}

.title-wrap,
.channel-wrap{
  position:relative;
}

/* Skeleton on Text */
.title-wrap::before,
.channel-wrap::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#1c1c1c 25%,#2a2a2a 37%,#1c1c1c 63%);
  background-size:400% 100%;
  animation:shimmer 1.6s linear 1;
  pointer-events:none;
  border-radius:4px;
  z-index:2;
}

.title{font-size:14px;font-weight:700;}
.channel{font-size:12px;color:#999;font-weight:400;}

/* ===== Time Badge ===== */
.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:#ffbe00;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
  font-weight:700;
  z-index:3;
}

/* ===== Keyframes ===== */
@keyframes shimmer{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}

/* ===== Loaded State ===== */
.loaded .thumb::before,
.loaded .title-wrap::before,
.loaded .channel-wrap::before{
  display:none;
}

/* ===== Responsive ===== */
@media (max-width:768px){
  .header{height:64px;}
  .spacer{height:64px;}
  .thumb{height:140px;}
}
</style>
</head>

<body>

<header class="header">
  <div class="logo-center">
    <img src="image/logo.png" alt="Logo">
    <span class="logo-text">قاب</span>
  </div>
</header>

<div class="spacer"></div>

<div class="container">
  <div class="videos">

    <!-- CARD 1 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?1">
        <span class="time">20:31</span>
      </div>
      <div class="info">
        <div class="title-wrap"><div class="title">سونیک کالرز آلتیمیت با مود</div></div>
        <div class="channel-wrap"><div class="channel">Neo Charmy · 34 بازدید</div></div>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?2">
        <span class="time">00:09</span>
      </div>
      <div class="info">
        <div class="title-wrap"><div class="title">رانش زمین در جاده ایذه</div></div>
        <div class="channel-wrap"><div class="channel">عصر ایران · 796 بازدید</div></div>
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?3">
        <span class="time">11:26</span>
      </div>
      <div class="info">
        <div class="title-wrap"><div class="title">ارائه خانم زهرا محمدی</div></div>
        <div class="channel-wrap"><div class="channel">کانال رسمی · 1 بازدید</div></div>
      </div>
    </div>

  </div>
</div>

<script>
// وقتی اسکلت تموم شد، حذف میشه
setTimeout(()=>{
  document.body.classList.add("loaded");
},1600);
</script>

</body>
</html>
