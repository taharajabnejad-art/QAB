<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filimo</title>

<style>
@font-face {
  font-family: Vazirmatn;
  src: url("https://cdn.jsdelivr.net/npm/vazirmatn@33.003/fonts/webfonts/Vazirmatn-Regular.woff2");
}

body {
  margin: 0;
  font-family: Vazirmatn;
  background: #0d0d0d;
  color: #fff;
}

.hero {
  height: 100vh;
  background:
    linear-gradient(120deg, #d4a12b 0%, transparent 40%),
    #0d0d0d;
  padding: 40px 24px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 42px;
  font-weight: 800;
}

.logo-box {
  width: 60px;
  height: 40px;
  border: 6px solid #d4a12b;
}

.text {
  margin-top: 140px;
}

.text h1 {
  font-size: 44px;
  margin: 0;
}

.text p {
  margin-top: 16px;
  font-size: 18px;
  opacity: 0.9;
}
</style>
</head>
<body>

<section class="hero">
  <div class="logo">
    <span>فیلیمو</span>
    <div class="logo-box"></div>
  </div>

  <div class="text">
    <h1>ما دنبال داستانیم</h1>
    <p>به جهان تماشایی فیلیمو خوش اومدید!</p>
  </div>
</section>

</body>
</html>
