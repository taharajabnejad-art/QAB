<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qab</title>

<style>

/* ================= FONT ================= */
/* 🔴 فونت Base64 خودت رو اینجا بچسبون */
@font-face{
  font-family:'MyFont';
  src:url(data:font/woff2;base64,PUT_BASE64_FONT_HERE) format('woff2');
  font-weight:400 700;
  font-style:normal;
}

body{
  margin:0;
  font-family:'MyFont', sans-serif;
  background:#0f0f0f;
  color:#eaeaea;
}

/* ================= HEADER ================= */
.header{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:#141414;
  border-bottom:1px solid #222;
}

.logo img{ height:24px; }

.search{
  flex:1;
  background:#1f1f1f;
  border-radius:10px;
  padding:8px 12px;
  font-size:14px;
  font-weight:400;
  color:#aaa;
}

.actions{ display:flex; gap:10px; }

.btn{
  width:28px;
  height:28px;
  border-radius:8px;
  background:#1f1f1f;
}

/* ================= CONTAINER ================= */
.container{
  padding:16px;
}

/* ================= BANNER ================= */
.banner{
  position:relative;
  height:140px;
  border-radius:16px;
  background:#1a1a1a;
  margin-bottom:20px;
  overflow:hidden;
}

/* ================= GRID ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

/* ================= CARD ================= */
.card{
  position:relative;
  background:#141414;
  border-radius:14px;
  overflow:hidden;
}

.thumb{
  height:120px;
  background:#1c1c1c;
}

.info{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.title{
  font-size:14px;
  font-weight:700;
}

.channel{
  font-size:12px;
  font-weight:400;
  color:#aaa;
}

/* ================= SKELETON ================= */
.skeleton{
  position:absolute;
  inset:0;
  background:#141414;
  z-index:5;
}

.shimmer{
  position:absolute;
  inset:0;
  background:linear-gradient(
    110deg,
    #141414 40%,
    #1f1f1f 50%,
    #141414 60%
  );
  animation:shimmer 1.2s linear 3;
}

/* هم‌اندازه اجزای واقعی */
.s-thumb{ height:120px; }
.s-title{
  height:14px;
  width:90%;
  border-radius:4px;
  background:#1f1f1f;
}
.s-channel{
  height:12px;
  width:60%;
  border-radius:4px;
  background:#1f1f1f;
}

.s-info{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

@keyframes shimmer{
  from{ transform:translateX(-100%); }
  to{ transform:translateX(100%); }
}

/* حذف کامل اسکلتون بعد ۳ بار */
.skeleton.done{
  display:none;
}

</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo"><img src="image/logo.png"></div>
  <div class="search">جستجو…</div>
  <div class="actions">
    <div class="btn"></div>
    <div class="btn"></div>
    <div class="btn"></div>
  </div>
</div>

<div class="container">

  <!-- ================= BANNER ================= -->
  <div class="banner">
    <div class="skeleton">
      <div class="shimmer"></div>
    </div>
  </div>

  <!-- ================= GRID ================= -->
  <div class="grid">

    <!-- CARD -->
    <div class="card">
      <div class="thumb"></div>
      <div class="info">
        <div class="title">عنوان ویدیو</div>
        <div class="channel">نام کانال</div>
      </div>

      <!-- SKELETON -->
      <div class="skeleton">
        <div class="shimmer"></div>
        <div class="s-thumb"></div>
        <div class="s-info">
          <div class="s-title"></div>
          <div class="s-channel"></div>
        </div>
      </div>
    </div>

    <!-- CARD -->
    <div class="card">
      <div class="thumb"></div>
      <div class="info">
        <div class="title">عنوان ویدیو</div>
        <div class="channel">نام کانال</div>
      </div>

      <div class="skeleton">
        <div class="shimmer"></div>
        <div class="s-thumb"></div>
        <div class="s-info">
          <div class="s-title"></div>
          <div class="s-channel"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* حذف اسکلتون بعد ۳ انیمیشن */
document.querySelectorAll('.skeleton').forEach(sk=>{
  setTimeout(()=>sk.classList.add('done'),3600);
});
</script>

</body>
</html>
