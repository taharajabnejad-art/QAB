<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"MainFont", sans-serif; background:#0d0d0d; color:#fff; overflow-x:hidden; }

/* ================= MODERN LOADING ================= */
#loading {
  position: fixed;
  inset: 0;
  background: #0d0d0d;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  overflow: hidden;
}

.loader-bg {
  width: 300px;
  height: 150px;
  background: #1a1a1a; /* شبیه بلوک سایت */
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
}

.loader-block {
  height: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
}

.loader-shine {
  position: absolute;
  top: -50%;
  left: -50%;
  width: 50%;
  height: 200%;
  background: rgba(255,255,255,0.15);
  transform: rotate(25deg);
  animation: shine 1.5s infinite;
}

@keyframes shine {
  0%   { transform: translateX(-150%) rotate(25deg); }
  50%  { transform: translateX(150%) rotate(25deg); }
  100% { transform: translateX(-150%) rotate(25deg); }
}

/* ================= HERO ================= */
.hero {
  min-height: 80vh;
  padding: 32px 20px;
  background: linear-gradient(120deg, #FFBE00 0%, transparent 45%), #0d0d0d;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: opacity 0.5s;
  opacity: 0;
}

.hero-header-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 80px;
  background: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
  pointer-events: none; z-index: 1;
}

.hero-header-fixed {
  position: fixed; top: 0; left: 0; width: 100%;
  display:flex; justify-content:flex-start; align-items:center;
  padding:10px 20px; z-index: 2;
}

.logo {
  display:flex; align-items:center; gap:12px;
  font-size:36px; font-weight:700;
}

.logo-box-img {
  width:54px; height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter: drop-shadow(0 0 5px #FFBE00);
}

.hero-text { margin-top:140px; text-align:center; position: relative; z-index:0; }
.hero-text h1 { font-size:36px; font-weight:700; }
.hero-text p { margin-top:12px; font-size:16px; opacity:0.85; }
.cta-button {
  background:#FFBE00; color:#0d0d0d; font-size:16px; font-weight:700;
  padding:12px 28px; border:none; border-radius:6px;
  cursor:pointer; margin-top:24px; display:inline-block; text-decoration:none;
}

/* ================= SUGGESTIONS ================= */
.section { padding:16px 14px 32px; }
.section-title { margin:16px 6px; font-size:18px; font-weight:600; }
.suggestions { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:16px; }
.suggestion-item { width:200px; text-align:center; }
.suggestion-item img { width:100%; aspect-ratio:16/9; border-radius:8px; object-fit:cover; }
.suggestion-item p { margin-top:6px; font-size:14px; color:#fff; opacity:0.9; }

</style>
</head>

<body>

<!-- ================= MODERN LOADING ================= -->
<div id="loading">
  <div class="loader-bg">
    <div class="loader-block" style="width:80%;"></div>
    <div class="loader-block" style="width:60%;"></div>
    <div class="loader-block" style="width:90%;"></div>
    <div class="loader-shine"></div>
  </div>
</div>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-bg"></div>
  <div class="hero-header-fixed">
    <div class="logo"><span>قاب</span><div class="logo-box-img"></div></div>
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a href="#" class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>
  <div class="suggestions">
    <div class="suggestion-item">
      <a href="#"><img src="#" alt="ویدئو ۱"><p>عنوان ویدئو ۱</p></a>
    </div>
    <div class="suggestion-item">
      <a href="#"><img src="#" alt="ویدئو ۲"><p>عنوان ویدئو ۲</p></a>
    </div>
    <div class="suggestion-item">
      <a href="#"><img src="#" alt="ویدئو ۳"><p>عنوان ویدئو ۳</p></a>
    </div>
  </div>
</section>

<script>
window.addEventListener('load', () => {
  const loading = document.getElementById('loading');
  const hero = document.querySelector('.hero');

  setTimeout(() => {
    loading.style.opacity = '0';
    setTimeout(() => {
      loading.remove();
      hero.style.opacity = 1;
    }, 800);
  }, 2000); // مدت زمان نمایش لودینگ
});
</script>

</body>
</html>
