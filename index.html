<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"MainFont", sans-serif; background:#0d0d0d; color:#fff; overflow-x:hidden; }

/* ================= LOADING VIDEO ================= */
#loading {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#0d0d0d;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  z-index:9999;
  opacity:1;
  transition: opacity 0.8s ease, transform 0.8s ease;
}

#loading video {
  width: 50px;
  height: auto;
  object-fit: contain;
  animation: pulse 1.2s infinite;
}

#loading-text {
  color:#fff;
  font-size:16px;
  margin-top:20px;
  opacity:0.85;
  animation: blink 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes blink {
  0%, 50%, 100% { opacity:0.85; }
  25%, 75% { opacity:0.4; }
}

#loading.hide {
  opacity:0;
  transform: scale(0.95);
  pointer-events:none;
}

/* ================= HERO ================= */
.hero {
  min-height: 80vh;
  padding: 32px 20px;
  background: linear-gradient(120deg, #FFBE00 0%, #0d0d0d 45%), #0d0d0d;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: opacity 0.5s;
  opacity:0;
}

.hero-header-bg {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:80px;
  background: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
  pointer-events:none;
  z-index:1;
}

.hero-header-fixed {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  padding:10px 20px;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
  color:#fff;
}

.logo-box-img {
  width:54px;
  height:36px;
  border-radius:0;
  background-image:url('image/logo.png');
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  filter: drop-shadow(0 0 5px #FFBE00);
}

.hero-text {
  margin-top:140px;
  text-align:center;
  position:relative;
  z-index:0;
}

.hero-text h1 { font-size:36px; font-weight:700; }
.hero-text p { margin-top:12px; font-size:16px; opacity:0.85; }

.cta-button {
  background-color:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:transform 0.2s, box-shadow 0.2s;
  text-decoration:none;
  display:inline-block;
  margin-top:24px;
}

.cta-button:hover {
  transform:translateY(-2px);
  box-shadow:0 6px 12px rgba(255,190,0,0.4);
}

/* ================= SUGGESTIONS ================= */
.section { padding:16px 14px 32px; }
.section-title { margin:16px 6px; font-size:18px; font-weight:600; }

.suggestions {
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  justify-content:center;
  margin-top:16px;
}

.suggestion-item { width:200px; text-align:center; }

.suggestion-item img {
  width:100%;
  aspect-ratio:16/9;
  border-radius:8px;
  object-fit:cover;
}

.suggestion-item p {
  margin-top:6px;
  font-size:14px;
  color:#fff;
  opacity:0.9;
}
</style>
</head>

<body>

<!-- ================= LOADING VIDEO ================= -->
<div id="loading">
  <video id="loading-video" autoplay muted loop playsinline>
    <source src="image/loading.mp4" type="video/mp4">
  </video>
  <p id="loading-text">در حال بارگذاری…</p>
</div>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-bg"></div>

  <div class="hero-header-fixed">
    <div class="logo"><span>قاب</span><div class="logo-box-img"></div></div>
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a href="#" class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>
  <div class="suggestions">
    <div class="suggestion-item">
      <a href="#"><img src="#" alt="ویدئو ۱"><p>عنوان ویدئو ۱</p></a>
    </div>
    <div class="suggestion-item">
      <a href="#"><img src="#" alt="ویدئو ۲"><p>عنوان ویدئو ۲</p></a>
    </div>
    <div class="suggestion-item">
      <a href="#"><img src="#" alt="ویدئو ۳"><p>عنوان ویدئو ۳</p></a>
    </div>
  </div>
</section>

<script>
window.addEventListener('load', () => {
  const loading = document.getElementById('loading');
  const hero = document.querySelector('.hero');

  // مدت زمان دلخواه قبل از محو شدن لودینگ
  setTimeout(() => {
    loading.classList.add('hide');
    hero.style.opacity = 1;
  }, 2200);
});
</script>

</body>
</html>
