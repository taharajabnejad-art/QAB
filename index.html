<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:#0d0d0d;
  position:relative;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ================= HEADER ================= */
.hero-header-fixed {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:12px;
  z-index:2;
}

.logo {
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

/* ================= HERO TEXT ================= */
.hero-text {
  margin-top:140px;
  text-align:center;
}

/* ================= TEXT SKELETON ================= */
.skeleton {
  position: relative;
  display: inline-block;
  border-radius: 10px;
  overflow: hidden;
  z-index: 1;
}

.skeleton::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    #1f1f1f 30%,
    #2b2b2b 50%,
    #1f1f1f 70%
  );
  background-size: 400%;
  border-radius: 8px;
  animation: shimmer 1.6s linear;
  animation-iteration-count: 3;
  z-index: 2;
}

.skeleton.loaded::before { display: none; }

@keyframes shimmer {
  from { background-position: 100% 0; }
  to { background-position: 0 0; }
}

.hero-title {
  font-size: 42px;
  margin-bottom:16px;
}

.hero-desc {
  font-size: 18px;
  margin-bottom:32px;
}

.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  text-decoration:none;
  display:inline-block;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-fixed">
    <div class="logo">قاب</div>
    <div class="logo-box-img"></div>
  </div>

  <div class="hero-text">
    <div class="hero-title skeleton">داستان جهان ویدئو</div>
    <div class="hero-desc skeleton">جایی برای تجربه و اشتراک ویدئوها</div>
    <a class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<script>
document.querySelectorAll('.skeleton').forEach(el => {
  const duration = 1600 * 3; // ۳ بار انیمیشن
  setTimeout(() => { el.classList.add('loaded'); }, duration);
});
</script>

</body>
</html>
