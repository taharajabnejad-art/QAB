<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg, #FFBE00 0%, transparent 45%),
    #0d0d0d;
  position:relative;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:10px 20px;
  display:flex;
  align-items:center;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px; height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter: drop-shadow(0 0 5px #FFBE00);
}

/* ================= TEXT ================= */
.hero-text {
  margin-top:140px;
  text-align:center;
}

/* Placeholder و Skeleton */
.placeholder {
  width:70%;
  height:42px;
  margin:0 auto 16px;
  background: rgba(255,255,255,0.03); /* بی‌رنگ ولی مشخص */
  border-radius:6px;
  position: relative;
  overflow: hidden;
}

.skeleton {
  content:"";
  position: absolute;
  top:0; left:-140%;
  width:55%;
  height:100%;
  background: linear-gradient(
    110deg,
    transparent 0%,
    rgba(255,255,255,.18) 45%,
    rgba(255,255,255,.28) 50%,
    rgba(255,255,255,.18) 55%,
    transparent 100%
  );
  animation: shine 0.5s linear 3; /* سه بار حرکت */
}

@keyframes shine {
  to { left: 140%; }
}

/* ================= CTA ================= */
.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  margin-top:32px;
  display:inline-block;
  text-decoration:none;
}

/* ================= SUGGESTIONS ================= */
.section {
  padding:24px 16px;
}

.section-title {
  font-size:18px;
  font-weight:600;
  margin-bottom:16px;
}

.suggestions {
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
}

.video-card {
  width:200px;
}

.thumb {
  width:100%;
  aspect-ratio:16/9;
  border-radius:8px;
  background: rgba(255,255,255,0.03); /* placeholder اولیه */
  position: relative;
  overflow: hidden;
}

.thumb .skeleton {
  position:absolute;
  top:0; left:-140%;
  width:55%;
  height:100%;
  background: linear-gradient(
    110deg,
    transparent 0%,
    rgba(255,255,255,.18) 45%,
    rgba(255,255,255,.28) 50%,
    rgba(255,255,255,.18) 55%,
    transparent 100%
  );
  animation: shine 0.5s linear 3;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <div class="hero-text">
    <div class="placeholder">
      <div class="skeleton"></div>
    </div>
    <div class="placeholder" style="width:55%;">
      <div class="skeleton"></div>
    </div>

    <a class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>

  <div class="suggestions">
    <div class="video-card">
      <div class="thumb">
        <div class="skeleton"></div>
      </div>
    </div>

    <div class="video-card">
      <div class="thumb">
        <div class="skeleton"></div>
      </div>
    </div>

    <div class="video-card">
      <div class="thumb">
        <div class="skeleton"></div>
      </div>
    </div>
  </div>
</section>

<script>
// بعد از 3 حرکت Skeleton، آن را حذف می‌کنیم
window.addEventListener('load', () => {
  const allSkeletons = document.querySelectorAll('.skeleton');
  allSkeletons.forEach(skel => {
    // مدت زمان سه حرکت 0.5s * 3 = 1.5s
    setTimeout(() => {
      skel.parentNode.classList.remove('skeleton');
      skel.remove();
    }, 1500);
  });
});
</script>

</body>
</html>
