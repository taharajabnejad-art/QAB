<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاب – جهان ویدیو</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#f7f7f7;
  min-height:200vh;
}

/* ===== HEADER ===== */
.header{
  position:fixed;
  top:0;
  right:0;
  width:100%;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center; /* لوگو وسط */
  z-index:1000;

  /* گرادینت عمودی از بالا به پایین */
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,1) 0%,
    rgba(0,0,0,0.7) 35%,
    rgba(0,0,0,0.3) 65%,
    rgba(0,0,0,0) 100%
  );
}

/* لوگو + متن قاب وسط */
.logo{
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  font-size:22px;
  font-weight:700;
}

.logo-mark{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#fff;
}

/* فاصله محتوا تا هدر */
.spacer{height:80px;}

/* ===== VIDEOS ===== */
.container{
  padding:20px;
}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

.card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

.thumb{
  position:relative;
}

.thumb img{
  width:100%;
  display:block;
}

.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
}

.info{
  padding:10px;
}

.title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px;
}

.channel{
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <div class="logo-mark"></div>
    <span>قاب</span>
  </div>
</header>

<div class="spacer"></div>

<div class="container">
  <div class="videos">

    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?1">
        <span class="time">20:31</span>
      </div>
      <div class="info">
        <div class="title">سونیک کالرز آلتیمیت با مود</div>
        <div class="channel">Neo Charmy · 34 بازدید</div>
      </div>
    </div>

    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?2">
        <span class="time">00:09</span>
      </div>
      <div class="info">
        <div class="title">رانش زمین در جاده ایذه</div>
        <div class="channel">عصر ایران · 796 بازدید</div>
      </div>
    </div>

    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?3">
        <span class="time">11:26</span>
      </div>
      <div class="info">
        <div class="title">ارائه خانم زهرا محمدی</div>
        <div class="channel">کانال رسمی · 1 بازدید</div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
