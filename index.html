<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
  overflow-x:hidden;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background: linear-gradient(120deg, #FFBE00 0%, transparent 45%), #0d0d0d;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-shadow: inset 0 0 40px #FFBE00, inset 0 0 80px #FFBE00;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

.hero-text {
  margin-top:140px;
}

.hero-title {
  font-size:42px;
  font-weight:700;
  margin-bottom:12px;
}

.hero-desc {
  font-size:18px;
  opacity:0.85;
  margin-bottom:32px;
}

.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  text-decoration:none;
  display:inline-block;
}

/* ================= SKELETON TEXT ================= */
.skeleton-text {
  position: relative;
  color: transparent;
}

.skeleton-text::before {
  content: "";
  position: absolute;
  inset: 0;
  background: #e2e5e7;
  border-radius: 6px;
}

.skeleton-text::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.6),
    transparent
  );
  transform: translateX(-100%);
  animation: shimmer 1.6s infinite;
}

/* دکمه اسکلتون */
.skeleton-btn {
  position: relative;
  color: transparent;
  pointer-events: none;
}

.skeleton-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.6),
    transparent
  );
  transform: translateX(-100%);
  animation: shimmer 1.6s infinite;
}

/* بعد از لود */
.loaded .skeleton-text {
  color: inherit;
}

.loaded .skeleton-text::before,
.loaded .skeleton-text::after,
.loaded .skeleton-btn::after {
  display: none;
}

@keyframes shimmer {
  100% { transform: translateX(100%); }
}

/* ================= RESPONSIVE ================= */
@media(max-width:600px){
  .hero-title { font-size:32px; }
  .hero-desc { font-size:16px; }
}
</style>
</head>

<body>

<!-- HEADER FIXED -->
<div class="hero-header-fixed">
  <div class="logo">
    <span>قاب</span>
    <div class="logo-box-img"></div>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <div class="hero-title skeleton-text">داستان جهان ویدئو</div>
    <div class="hero-desc skeleton-text">جایی برای تجربه و اشتراک ویدئوها</div>
    <a class="cta-button skeleton-btn">داستان خودتو بنویس</a>
  </div>
</section>

<!-- شبیه‌سازی لود -->
<script>
setTimeout(() => {
  document.body.classList.add('loaded');
}, 2500);
</script>

</body>
</html>
