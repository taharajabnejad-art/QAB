<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاب</title>

<style>
/* ===== FONT BASE64 ===== */
@font-face {
  font-family: Qab;
  src: url(data:font/woff2;base64,XXXX) format("woff2");
  font-weight:400;
}
@font-face {
  font-family: Qab;
  src: url(data:font/woff2;base64,YYYY) format("woff2");
  font-weight:700;
}

body {
  margin:0;
  font-family: Qab, sans-serif;
  background:#f7f7f7;
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:64px;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  background: linear-gradient(to bottom, #000000 0%, rgba(0,0,0,0) 100%);
  z-index:999;
}

.logo {
  display:flex;
  align-items:center;
  gap:8px;
}

.logo img {
  height:32px;
}

.logo span {
  font-weight:700;
  font-size:18px;
  color:#fff;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .header {
    padding:0 12px;
  }
  .logo span {
    font-size:16px;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <img src="image/logo.png" alt="لوگو">
    <span>قاب</span>
  </div>
</header>

<!-- محتوا برای تست اسکرول -->
<div style="margin-top:80px; padding:20px;">
  <p>این یک متن تست برای مشاهده اسکرول است.</p>
  <p>تکرار ...</p>
  <p>تکرار ...</p>
  <p>تکرار ...</p>
  <p>تکرار ...</p>
</div>

</body>
</html>
