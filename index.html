<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
  overflow-x:hidden;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background: linear-gradient(120deg, #FFBE00 0%, transparent 45%), #0d0d0d;
  display:flex;
  flex-direction:column;
  align-items:center; /* وسط‌چین */
  position:relative;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:10px 20px;
  display:flex;
  align-items:center;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

/* ================= HERO TEXT ================= */
.hero-text {
  margin-top:140px;
  text-align:center;
  position:relative;
}

.skeleton-wrapper {
  position: relative;
  width: 100%;
  max-width:600px;
  height: auto;
  margin:12px auto;
}

.skeleton {
  width: 100%;
  height: 100%;
  background:#1a1a1a;
  border-radius:8px;
  position:absolute;
  top:0; left:0;
  animation: skeleton-shine 0.8s linear 3; /* 3 حرکت کند */
}

@keyframes skeleton-shine {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

.skeleton-wrapper h1,
.skeleton-wrapper p {
  position:relative;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  height:100%;
}

/* ================= CTA ================= */
.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  margin-top:32px;
  display:inline-block;
  text-decoration:none;
}
</style>
</head>

<body>
<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <div class="hero-text">
    <!-- عنوان -->
    <div class="skeleton-wrapper" style="height:42px;">
      <div class="skeleton"></div>
      <h1>داستانت رو پیدا کن</h1>
    </div>

    <!-- توضیح -->
    <div class="skeleton-wrapper" style="height:18px; max-width:400px;">
      <div class="skeleton"></div>
      <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
    </div>

    <a class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<script>
window.addEventListener('load', () => {
  // بعد از 3 حرکت Skeleton، آن را حذف و متن نمایش داده شود
  const skeletons = document.querySelectorAll('.skeleton');
  skeletons.forEach(skel => {
    // کل زمان: 3 حرکت × 0.8s
    setTimeout(() => skel.remove(), 2400);
  });
});
</script>

</body>
</html>
