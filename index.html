<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg, #FFBE00 0%, transparent 45%),
    #0d0d0d;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* هدر ثابت */
.hero-header-bg {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:80px;
  background:linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
  z-index:1;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:10px 20px;
  display:flex;
  align-items:center;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url("image/logo.png") no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

/* ================= HERO TEXT ================= */
.hero-text {
  margin-top:140px;
  text-align:center;
}

/* ================= REAL CONTENT ================= */
.real.hidden {
  display:none;
}

/* ================= CTA ================= */
.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  display:inline-block;
  margin-top:24px;
  text-decoration:none;
}

/* ================= SKELETON ================= */
.skeleton {
  position:relative;
  background:#1a1a1a;
  overflow:hidden;
  border-radius:6px;
}

.skeleton::after {
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.15),
    transparent
  );
  animation:skeleton-move 1.4s infinite;
}

@keyframes skeleton-move {
  100% { left:100%; }
}

/* اسکلت بنر */
.skeleton-banner {
  width:100%;
  height:220px;
  border-radius:12px;
  margin-top:120px;
}

/* اسکلت متن */
.skeleton-title {
  width:260px;
  height:34px;
  margin:32px auto 16px;
}

.skeleton-desc {
  width:320px;
  height:18px;
  margin:0 auto;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">

  <div class="hero-header-bg"></div>

  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <!-- Skeleton Banner -->
  <div class="skeleton skeleton-banner"></div>

  <!-- Skeleton Text -->
  <div class="hero-text">
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-desc"></div>

    <!-- متن واقعی -->
    <h1 class="real hidden">داستانت رو پیدا کن</h1>
    <p class="real hidden">قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a href="#" class="cta-button">داستان خودتو بنویس</a>
  </div>

</section>

<script>
window.addEventListener("load", () => {
  // حذف تمام skeleton ها
  document.querySelectorAll(".skeleton").forEach(el => el.remove());

  // نمایش محتوای واقعی
  document.querySelectorAll(".real").forEach(el => {
    el.classList.remove("hidden");
  });
});
</script>

</body>
</html>
