<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
body {
  font-family: "MainFont", sans-serif;
  background: #0d0d0d;
  color: #fff;
  margin:0; padding:0;
}

/* ================= SKELETON ================= */
.skeleton {
  position: relative;
  background: #2a2a2a;
  border-radius: 8px;
  overflow: hidden;
}

.skeleton::after {
  content: "";
  position: absolute;
  top:0; left:-150%;
  width:50%;
  height:100%;
  background: linear-gradient(
    110deg,
    transparent 0%,
    rgba(255,255,255,0.15) 45%,
    rgba(255,255,255,0.25) 50%,
    rgba(255,255,255,0.15) 55%,
    transparent 100%
  );
  animation: skeleton-shine 0.6s linear 3;
}

@keyframes skeleton-shine {
  to { left: 150%; }
}

.skeleton.loaded { display:none; }

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg, #FFBE00 0%, transparent 45%),
    #0d0d0d;
  position:relative;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  display:flex;
  align-items:center;
  padding:10px 20px;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter: drop-shadow(0 0 5px #FFBE00);
}

/* ================= HERO TEXT ================= */
.hero-text {
  margin-top:140px;
  text-align:center;
}

.hero-title, .hero-desc {
  border-radius:6px;
}

/* ================= CTA ================= */
.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  margin-top:32px;
  display:inline-block;
  text-decoration:none;
}

/* ================= SUGGESTIONS ================= */
.section {
  padding:24px 16px;
}

.section-title {
  font-size:18px;
  font-weight:600;
  margin-bottom:16px;
}

.suggestions {
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
}

.video-card {
  width:200px;
}

.thumb {
  width:100%;
  aspect-ratio:16/9;
  border-radius:8px;
}

.meta {
  margin-top:8px;
}

.line {
  height:14px;
  margin-bottom:6px;
  border-radius:6px;
}

.line.small { width:60%; }
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <!-- Skeleton Hero -->
  <div class="skeleton hero-title" style="width:70%; height:42px; margin:0 auto 16px;"></div>
  <div class="skeleton hero-desc" style="width:55%; height:18px; margin:0 auto;"></div>

  <!-- Actual Content -->
  <div class="hero-text">
    <h1 class="hero-title-text">داستانت رو پیدا کن</h1>
    <p class="hero-desc-text">قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>

  <div class="suggestions">
    <div class="video-card">
      <div class="skeleton thumb" style="height:112px;"></div>
      <div class="meta">
        <div class="skeleton line"></div>
        <div class="skeleton line small"></div>
      </div>
      <div class="video-content" style="display:none;">
        <div class="thumb" style="background:#444;"></div>
        <div class="meta">
          <div class="line" style="background:#555;"></div>
          <div class="line small" style="background:#555;"></div>
        </div>
      </div>
    </div>

    <div class="video-card">
      <div class="skeleton thumb" style="height:112px;"></div>
      <div class="meta">
        <div class="skeleton line"></div>
        <div class="skeleton line small"></div>
      </div>
      <div class="video-content" style="display:none;">
        <div class="thumb" style="background:#444;"></div>
        <div class="meta">
          <div class="line" style="background:#555;"></div>
          <div class="line small" style="background:#555;"></div>
        </div>
      </div>
    </div>

    <div class="video-card">
      <div class="skeleton thumb" style="height:112px;"></div>
      <div class="meta">
        <div class="skeleton line"></div>
        <div class="skeleton line small"></div>
      </div>
      <div class="video-content" style="display:none;">
        <div class="thumb" style="background:#444;"></div>
        <div class="meta">
          <div class="line" style="background:#555;"></div>
          <div class="line small" style="background:#555;"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
// Skeleton ها 3 بار حرکت می‌کنند و بعد حذف می‌شوند، محتوا نمایش داده می‌شود
window.addEventListener('load', () => {
  const skeletons = document.querySelectorAll('.skeleton');
  skeletons.forEach(el => {
    el.addEventListener('animationend', () => {
      el.classList.add('loaded');
      const parentCard = el.closest('.video-card');
      if(parentCard){
        const content = parentCard.querySelector('.video-content');
        if(content) content.style.display='block';
      }
    });
  });
});
</script>

</body>
</html>
