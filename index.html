<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}

@font-face {
  font-family: "UIFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}

/* ================= RESET ================= */
* { box-sizing: border-box; margin:0; padding:0; }

/* ================= BODY ================= */
body {
  font-family: "MainFont", sans-serif;
  background: #0d0d0d;
  color: #ffffff;
}

/* ================= HERO ================= */
.hero {
  min-height: 100vh;
  padding: 32px 20px;
  background:
    linear-gradient(120deg, #7c6cff 0%, transparent 45%),
    #0d0d0d;
  display: flex;
  flex-direction: column;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 36px;
  font-weight: 700;
  color: #FFFFFF; /* متن لوگو سفید */
}

.logo-box-img {
  width: 54px;       /* اندازه واقعی لوگو */
  height: 36px;
  border-radius: 0;  /* گوشه‌ها تیز */
  background-image: url('image/logo.png'); /* لوگو PNG */
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  filter: drop-shadow(0 0 5px #FFBE00); /* سایه زرد روی لوگو */
}

.hero-text {
  margin-top: 140px;
}

.hero-text h1 {
  font-size: 36px;
  font-weight: 700;
}

.hero-text p {
  margin-top: 12px;
  font-size: 16px;
  opacity: 0.85;
}

/* ================= SECTION ================= */
.section {
  padding: 16px 14px 32px;
}

.section-title {
  margin: 16px 6px;
  font-size: 18px;
  font-weight: 600;
}

/* ================= GRID ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

/* ================= CARD ================= */
.card { position: relative; }

.poster {
  width: 100%;
  aspect-ratio: 2/3;
  border-radius: 14px;
  background-size: cover;
  background-position: center;
}

.sound {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.title {
  margin-top: 8px;
  font-family: "UIFont", sans-serif;
  font-size: 13px;
  text-align: center;
  opacity: 0.95;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="logo">
    <span>قاب</span> <!-- متن لوگو سفید -->
    <div class="logo-box-img"></div> <!-- PNG لوگو با سایه زرد -->
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
  </div>
</section>

<!-- ================= CONTENT ================= -->
<section class="section">
  <div class="section-title">ویژه</div>

  <div class="grid">
    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">باب اسفنجی</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">گارفیلد</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">ماینکرفت</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">کمپ کورال</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">بچه‌های بد ۲</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">نجات بیکینی باتم</div>
    </div>
  </div>
</section>

</body>
</html>
