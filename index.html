<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}

@font-face {
  font-family: "UIFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}

/* ================= RESET ================= */
* { box-sizing: border-box; margin:0; padding:0; }

/* ================= BODY ================= */
body {
  font-family: "MainFont", sans-serif;
  background: #0d0d0d;
  color: #ffffff;
}

/* ================= HERO ================= */
.hero {
  height: 100vh; /* مثل نسخه اولیه */
  padding: 32px 20px;
  background:
    linear-gradient(120deg, #FFBE00 0%, transparent 45%),
    #0d0d0d; /* گرادیان و بک‌گراند */
  display: flex;
  flex-direction: column;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 36px;
  font-weight: 700;
  color: #FFFFFF;
}

.logo-box-img {
  width: 54px;
  height: 36px;
  border-radius: 0;
  background-image: url('image/logo.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  filter: drop-shadow(0 0 5px #FFBE00);
}

.hero-text {
  margin-top: 100px;
  text-align: center;
}

.hero-text h1 {
  font-size: 36px;
  font-weight: 700;
}

.hero-text p {
  margin-top: 12px;
  font-size: 16px;
  opacity: 0.85;
}

/* ================= CTA BUTTON ================= */
.cta-button {
  background-color: #FFBE00;
  color: #0d0d0d;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 28px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none;
  display: inline-block;
  margin-top: 24px;
}

.cta-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(255, 190, 0, 0.4);
}

/* ================= SECTIONS ================= */
.section {
  padding: 24px 16px;
}

.section-title {
  margin-bottom: 16px;
  font-size: 20px;
  font-weight: 600;
}

/* ================= HORIZONTAL SCROLL GRID ================= */
.horizontal-scroll {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.horizontal-scroll::-webkit-scrollbar {
  height: 8px;
}

.horizontal-scroll::-webkit-scrollbar-thumb {
  background-color: #FFBE00;
  border-radius: 4px;
}

.video-card {
  flex: 0 0 220px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}

.video-card .thumbnail {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 8px;
  background-size: cover;
  background-position: center;
  transition: transform 0.2s;
}

.video-card .thumbnail:hover {
  transform: scale(1.05);
}

.video-card .video-title {
  margin-top: 8px;
  font-size: 14px;
  color: #fff;
  text-align: center;
  opacity: 0.9;
}

.video-card .video-duration {
  position: absolute;
  bottom: 4px;
  right: 4px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 4px;
}

/* ================= MULTI SECTION RESPONSIVE ================= */
@media (max-width: 768px) {
  .video-card { flex: 0 0 150px; }
  .hero-text h1 { font-size: 28px; }
  .hero-text p { font-size: 14px; }
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="logo">
    <span>قاب</span>
    <div class="logo-box-img"></div>
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a href="#" class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTION SECTIONS ================= -->
<section class="section">
  <div class="section-title">ویژه</div>
  <div class="horizontal-scroll">
    <div class="video-card">
      <div class="thumbnail" style="background-image:url('https://raw.githubusercontent.com/username/repo/branch/thumbnail1.jpg');"></div>
      <span class="video-duration">5:20</span>
      <p class="video-title">عنوان ویدئو ۱</p>
    </div>
    <div class="video-card">
      <div class="thumbnail" style="background-image:url('https://raw.githubusercontent.com/username/repo/branch/thumbnail2.jpg');"></div>
      <span class="video-duration">3:45</span>
      <p class="video-title">عنوان ویدئو ۲</p>
    </div>
    <div class="video-card">
      <div class="thumbnail" style="background-image:url('https://raw.githubusercontent.com/username/repo/branch/thumbnail3.jpg');"></div>
      <span class="video-duration">7:10</span>
      <p class="video-title">عنوان ویدئو ۳</p>
    </div>
    <div class="video-card">
      <div class="thumbnail" style="background-image:url('https://raw.githubusercontent.com/username/repo/branch/thumbnail4.jpg');"></div>
      <span class="video-duration">2:30</span>
      <p class="video-title">عنوان ویدئو ۴</p>
    </div>
  </div>
</section>

<section class="section">
  <div class="section-title">پرطرفدار</div>
  <div class="horizontal-scroll">
    <div class="video-card">
      <div class="thumbnail" style="background-image:url('https://raw.githubusercontent.com/username/repo/branch/thumbnail5.jpg');"></div>
      <span class="video-duration">4:50</span>
      <p class="video-title">عنوان ویدئو ۵</p>
    </div>
    <div class="video-card">
      <div class="thumbnail" style="background-image:url('https://raw.githubusercontent.com/username/repo/branch/thumbnail6.jpg');"></div>
      <span class="video-duration">6:15</span>
      <p class="video-title">عنوان ویدئو ۶</p>
    </div>
    <div class="video-card">
      <div class="thumbnail" style="background-image:url('https://raw.githubusercontent.com/username/repo/branch/thumbnail7.jpg');"></div>
      <span class="video-duration"></span>
      <p class="video-title">عنوان ویدئو ۷</p>
    </div>
  </div>
</section>

</body>
</html>
