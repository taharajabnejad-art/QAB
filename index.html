<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
  text-align:center;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background:#0d0d0d;
  position:relative;
}

.hero-header-fixed {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:10px 20px;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

/* ================= HERO TEXT ================= */
.hero-text {
  margin-top:140px;
}

.hero-title {
  font-size:42px;
  font-weight:700;
  margin-bottom:8px;
}

.hero-desc {
  font-size:18px;
  margin-bottom:32px;
}

/* ================= CTA ================= */
.cta-button {
  background:#FFBE00;
  color:#0d0d0d;
  font-size:16px;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  text-decoration:none;
  display:inline-block;
}

/* ================= SKELETON ================= */
.skeleton {
  position: relative;
  display: inline-block;
  border-radius: 10px;
  overflow: hidden;
  z-index: 1;
}

.skeleton::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    #1f1f1f 30%,
    #2b2b2b 50%,
    #1f1f1f 70%
  );
  background-size: 400%;
  border-radius: 8px;
  animation: shimmer 1.6s linear;
  animation-iteration-count: 3;
  z-index: 2;
}

.skeleton.loaded::before {
  display: none;
}

@keyframes shimmer {
  from { background-position: 100% 0; }
  to { background-position: 0 0; }
}

/* ================= SUGGESTIONS ================= */
.section {
  padding:24px 16px;
  text-align:center;
}

.section-title {
  font-size:18px;
  font-weight:600;
  margin-bottom:16px;
}

.suggestions {
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
}

.video-card {
  width:200px;
}

.thumb {
  width:100%;
  aspect-ratio:16/9;
  border-radius:8px;
  position: relative;
}

.thumb.skeleton::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    #1f1f1f 30%,
    #2b2b2b 50%,
    #1f1f1f 70%
  );
  background-size: 400%;
  border-radius: 8px;
  animation: shimmer 1.6s linear;
  animation-iteration-count: 3;
  z-index: 2;
}

.meta {
  margin-top:8px;
}

.line {
  height:14px;
  margin-bottom:6px;
  position: relative;
}

.line.skeleton::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    #1f1f1f 30%,
    #2b2b2b 50%,
    #1f1f1f 70%
  );
  background-size: 400%;
  border-radius: 6px;
  animation: shimmer 1.6s linear;
  animation-iteration-count: 3;
  z-index: 2;
}

.line.small {
  width:60%;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-fixed">
    <div class="logo-box-img"></div>
    <div class="logo">قاب</div>
  </div>

  <div class="hero-text">
    <div class="hero-title skeleton">داستان جهان ویدئو</div>
    <div class="hero-desc skeleton">جایی برای تجربه و اشتراک ویدئوها</div>
    <a class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>

  <div class="suggestions">
    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>

    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>

    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>
  </div>
</section>

<script>
document.querySelectorAll('.skeleton').forEach(el => {
  const duration = 1600 * 3; // ۳ بار انیمیشن
  setTimeout(() => {
    el.classList.add('loaded');
  }, duration);
});
</script>

</body>
</html>
