<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT MAIN ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}

@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Black.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
}

/* ================= FONT UI ================= */
@font-face {
  font-family: "UIFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}

/* ================= RESET ================= */
* {
  box-sizing: border-box;
}

/* ================= BODY ================= */
body {
  margin: 0;
  font-family: "MainFont", sans-serif;
  background: #0d0d0d;
  color: #ffffff;
}

/* ================= HERO ================= */
.hero {
  min-height: 100vh;
  padding: 32px 20px;
  background:
    linear-gradient(120deg, #ffbe00 0%, transparent 45%),
    #0d0d0d;
}

/* ================= LOGO ================= */
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 36px;
  font-weight: 700;
  font-family: "MainFont", sans-serif;
  color: #ffffff;
}

.logo-box-img {
  width: 54px;
  height: 36px;
  border-radius: 10px;
}

/* ================= HERO TEXT ================= */
.hero-text {
  margin-top: 140px;
}

.hero-text h1 {
  margin: 0;
  font-size: 36px;
  font-weight: 700;
}

.hero-text p {
  margin-top: 12px;
  font-size: 16px;
  opacity: 0.85;
}

/* ================= SECTION ================= */
.section {
  padding: 16px 14px 32px;
}

.section-title {
  margin: 16px 6px;
  font-size: 18px;
  font-weight: 600;
}

/* ================= GRID ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

/* ================= CARD ================= */
.card {
  position: relative;
}

.poster {
  width: 100%;
  aspect-ratio: 2 / 3;
  border-radius: 14px;
  background-size: cover;
  background-position: center;
}

.sound {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

/* ================= CARD TITLE ================= */
.title {
  margin-top: 8px;
  font-family: "UIFont", sans-serif;
  font-size: 13px;
  text-align: center;
  opacity: 0.95;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="logo">
    <span>قاب</span>
    <img src="image/logo.png" alt="لوگو" class="logo-box-img">
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
  </div>
</section>

<!-- ================= CONTENT ================= -->
<section class="section">
  <div class="section-title">ویژه</div>

  <div class="grid">

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">باب اسفنجی</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">گارفیلد</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">ماینکرفت</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">کمپ کورال</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">بچه‌های بد ۲</div>
    </div>

    <div class="card">
      <div class="poster" style="background-image:url('https://via.placeholder.com/300x450')"></div>
      <div class="sound">🔊</div>
      <div class="title">نجات بیکینی باتم</div>
    </div>

  </div>
</section>

<!-- ================= APARAT PLAYER ================= -->
<style>
.h_iframe-aparat_embed_frame{position:relative;}
.h_iframe-aparat_embed_frame .ratio{display:block;width:100%;height:auto;}
.h_iframe-aparat_embed_frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;}
</style>
<div class="h_iframe-aparat_embed_frame">
  <span style="display: block;padding-top: 57%"></span>
  <iframe src="https://www.aparat.com/video/video/embed/videohash/zbjxsto/vt/frame" allowFullScreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
</div>

</body>
</html>
