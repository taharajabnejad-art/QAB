<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONTS ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing: border-box; margin:0; padding:0; }

/* ================= BODY ================= */
body {
  font-family: "MainFont", sans-serif;
  background: #0d0d0d;
  color: #ffffff;
}

/* ================= HERO ================= */
.hero {
  min-height: 80vh;
  padding: 32px 20px;
  background: linear-gradient(120deg, #FFBE00 0%, transparent 45%), #0d0d0d;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===== FIXED HEADER LOGO ===== */
.hero-fixed {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: rgba(0,0,0,0.6); /* سیاه شفاف */
  z-index: 1000;
}

.logo-box-img {
  width: 54px;
  height: 36px;
  border-radius: 0;
  background-image: url('image/logo.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  filter: drop-shadow(0 0 5px #FFBE00);
}

/* ===== HERO TEXT & BUTTON ===== */
.hero-text {
  margin-top: 120px; /* فاصله از بالای صفحه */
  text-align: center;
}

.hero-text h1 {
  font-size: 36px;
  font-weight: 700;
}

.hero-text p {
  margin-top: 12px;
  font-size: 16px;
  opacity: 0.85;
}

.cta-button {
  background-color: #FFBE00;
  color: #0d0d0d;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 28px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none;
  display: inline-block;
  margin-top: 24px;
}

.cta-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(255, 190, 0, 0.4);
}

/* ================= SUGGESTIONS ================= */
.section {
  padding: 16px 14px 32px;
}

.section-title {
  margin: 16px 6px;
  font-size: 18px;
  font-weight: 600;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  margin-top: 16px;
}

.suggestion-item {
  width: 200px;
  text-align: center;
}

.suggestion-item img {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 8px;
  object-fit: cover;
}

.suggestion-item p {
  margin-top: 6px;
  font-size: 14px;
  color: #fff;
  opacity: 0.9;
}
</style>
</head>

<body>

<!-- ================= FIXED HERO LOGO ================= -->
<div class="hero-fixed">
  <span>قاب</span>
  <div class="logo-box-img"></div>
</div>

<!-- ================= HERO TEXT ================= -->
<section class="hero">
  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
    <a href="#" class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>

  <div class="suggestions">
    <div class="suggestion-item">
      <a href="#">
        <img src="https://via.placeholder.com/300x170" alt="ویدئو ۱">
        <p>عنوان ویدئو ۱</p>
      </a>
    </div>

    <div class="suggestion-item">
      <a href="#">
        <img src="https://via.placeholder.com/300x170" alt="ویدئو ۲">
        <p>عنوان ویدئو ۲</p>
      </a>
    </div>

    <div class="suggestion-item">
      <a href="#">
        <img src="https://via.placeholder.com/300x170" alt="ویدئو ۳">
        <p>عنوان ویدئو ۳</p>
      </a>
    </div>
  </div>
</section>

</body>
</html>
