<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
@font-face {
  font-family:"MainFont";
  src:url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight:700;
}
@font-face {
  font-family:"MainFont";
  src:url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight:400;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"MainFont",sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= LOADING OVERLAY ================= */
#loading{
  position:fixed;
  inset:0;
  background:#0d0d0d;
  z-index:9999;
}

/* لایه سایه */
.shine{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.shine::after{
  content:'';
  position:absolute;
  top:0;
  left:-140%;
  width:55%;
  height:100%;
  background:linear-gradient(
    110deg,
    transparent 0%,
    rgba(255,255,255,.18) 45%,
    rgba(255,255,255,.25) 50%,
    rgba(255,255,255,.18) 55%,
    transparent 100%
  );
  animation:shine-move 1.4s linear infinite;
}

@keyframes shine-move{
  to{ left:140% }
}

#loading.hide{
  opacity:0;
  transition:opacity .7s ease;
  pointer-events:none;
}

/* ================= HERO ================= */
.hero{
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg,#FFBE00 0%,transparent 45%),
    #0d0d0d;
  position:relative;
}

/* Header */
.hero-header-fixed{
  position:fixed;
  top:0;left:0;
  width:100%;
  padding:10px 20px;
  display:flex;
  align-items:center;
  z-index:2;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img{
  width:54px;
  height:36px;
  background:url("image/logo.png") no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

/* محتوا */
.hero-text{
  margin-top:140px;
  text-align:center;
}

.hero-text h1{font-size:36px}
.hero-text p{margin-top:12px;opacity:.85}

/* حالت لود */
.loading-state *{
  color:transparent !important;
  background:#1a1a1a;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}
.loading-state img{opacity:0}
</style>
</head>

<body class="loading-state">

<!-- OVERLAY SHINE -->
<div id="loading">
  <div class="shine"></div>
</div>

<section class="hero">
  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <div class="hero-text">
    <h1>داستانت رو پیدا کن</h1>
    <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
  </div>
</section>

<script>
window.addEventListener('load',()=>{
  const loading=document.getElementById('loading')

  setTimeout(()=>{
    document.body.classList.remove('loading-state')
    loading.classList.add('hide')
    setTimeout(()=>loading.remove(),700)
  },2000)
})
</script>

</body>
</html>
