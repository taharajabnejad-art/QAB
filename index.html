<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"MainFont", sans-serif; background:#0d0d0d; color:#fff; }

/* ================= SKELETON ================= */
.skeleton {
  position: relative;
  background: #1a1a1a;
  overflow: hidden;
  border-radius: 10px;
}

.skeleton::after {
  content: "";
  position: absolute;
  top: 0; left: -140%;
  width: 55%;
  height: 100%;
  background: linear-gradient(
    110deg,
    transparent 0%,
    rgba(255,255,255,.18) 45%,
    rgba(255,255,255,.28) 50%,
    rgba(255,255,255,.18) 55%,
    transparent 100%
  );
  animation: skeleton-shine 1.2s linear infinite;
}

@keyframes skeleton-shine { to { left: 140%; } }

.skeleton.loaded { background: transparent; }
.skeleton.loaded::after { display:none; }

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  background: linear-gradient(120deg, #FFBE00 0%, transparent 45%), #0d0d0d;
  position:relative;
}

.hero-header-bg {
  position:fixed; top:0; left:0; width:100%; height:80px;
  background:linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
  pointer-events:none; z-index:1;
}

.hero-header-fixed {
  position:fixed; top:0; left:0; width:100%; padding:10px 20px;
  display:flex; align-items:center; z-index:2;
}

.logo {
  display:flex; align-items:center; gap:12px; font-size:36px; font-weight:700;
}

.logo-box-img {
  width:54px; height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

.hero-text { margin-top:140px; text-align:center; }
.hero-title { width:70%; height:42px; margin:0 auto 16px; }
.hero-desc { width:55%; height:18px; margin:0 auto; }
.cta-button {
  background:#FFBE00; color:#0d0d0d; font-size:16px; font-weight:700;
  padding:12px 28px; border-radius:6px; margin-top:32px;
  display:inline-block; text-decoration:none;
}

/* ================= SUGGESTIONS ================= */
.section { padding:24px 16px; }
.section-title { font-size:18px; font-weight:600; margin-bottom:16px; }
.suggestions { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.video-card { width:200px; }
.thumb { width:100%; aspect-ratio:16/9; border-radius:8px; }
.meta { margin-top:8px; }
.line { height:14px; margin-bottom:6px; }
.line.small { width:60%; }

/* ================= HIDDEN CONTENT ================= */
.hidden { visibility:hidden; }
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-header-bg"></div>
  <div class="hero-header-fixed">
    <div class="logo">
      <span>قاب</span>
      <div class="logo-box-img"></div>
    </div>
  </div>

  <div class="hero-text">
    <div class="skeleton hero-title"></div>
    <div class="skeleton hero-desc"></div>
    <a class="cta-button">داستان خودتو بنویس</a>
  </div>
</section>

<!-- ================= SUGGESTIONS ================= -->
<section class="section">
  <div class="section-title">پیشنهادها</div>
  <div class="suggestions">
    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>
    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>
    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= DYNAMIC SECTIONS ================= -->
<section class="section" id="section-4">
  <div class="section-title">بخش جدید ۴</div>
  <div class="suggestions">
    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>
  </div>
</section>

<section class="section" id="section-5">
  <div class="section-title">بخش جدید ۵</div>
  <div class="suggestions">
    <div class="video-card">
      <div class="thumb skeleton"></div>
      <div class="meta">
        <div class="line skeleton"></div>
        <div class="line skeleton small"></div>
      </div>
    </div>
  </div>
</section>

<script>
function loadSectionSkeleton(section) {
  const skeletons = section.querySelectorAll('.skeleton');
  let count = 0;
  const interval = setInterval(() => {
    count++;
    if(count >= 3){
      skeletons.forEach(s => s.classList.add('loaded'));
      clearInterval(interval);
    }
  }, 400); // هر حرکت ~0.4s × 3
}

// ================= INITIAL LOAD =================
window.addEventListener('load', () => {
  loadSectionSkeleton(document.querySelector('.hero'));
  document.querySelectorAll('.section').forEach((sec, idx) => {
    if(idx < 3) loadSectionSkeleton(sec); // اولین 3 بخش
  });
});

// ================= DYNAMIC SECTIONS =================
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting && !entry.target.dataset.loaded) {
      loadSectionSkeleton(entry.target);
      entry.target.dataset.loaded = true;
    }
  });
}, { threshold: 0.5 });

document.querySelectorAll('.section').forEach(sec => observer.observe(sec));
</script>

</body>
</html>
