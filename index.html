<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aparat Dark Skeleton + Base64 Font</title>

<style>
/* ===== فونت Base64 ===== */
@font-face {
  font-family: 'RaviFont';
  src: url(data:font/woff2;base64,BASE64_FONT_HERE) format('woff2');
  font-weight: normal;
  font-style: normal;
}

body {
  margin:0;
  font-family:'RaviFont', sans-serif;
  background:#0f0f0f;
  color:#eaeaea;
}

/* ===== Skeleton ===== */
.skeleton{
  background: linear-gradient(
    90deg,
    #1e1e1e 25%,
    #2a2a2a 37%,
    #1e1e1e 63%
  );
  background-size:400% 100%;
  animation:shimmer 1.2s linear 3; /* 👈 فقط سه بار */
  border-radius:10px;
}

@keyframes shimmer{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}

/* ===== Header ===== */
.header{
  height:64px;
  background:#141414;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  border-bottom:1px solid #222;
}

.logo img{
  height:24px; /* کوچیک */
  filter:brightness(1.1);
}

.search-skel, .search{
  flex:1;
  height:36px;
  border-radius:10px;
}

.search{
  background:#1f1f1f;
  padding:8px 12px;
  color:#aaa;
  font-size:14px;
}

.actions{
  display:flex;
  gap:10px;
}

.btn-skel, .btn{
  width:36px;
  height:36px;
  border-radius:10px;
  cursor:pointer;
}

.btn{
  border:1px solid #2a2a2a;
  background:#1a1a1a;
  color:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== Videos ===== */
.container{
  padding:20px;
}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

.card{
  background:#141414;
  border-radius:14px;
  overflow:hidden;
}

.thumb{
  position:relative;
  height:160px;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:#ffbe00;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
  font-weight:bold;
}

.info{
  padding:10px;
}

.title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px;
}

.channel{
  font-size:12px;
  color:#999;
}

/* ===== Skeleton Cards ===== */
.thumb-skel{
  height:160px;
  width:100%;
  margin-bottom:10px;
}

.title-skel{
  height:14px;
  width:90%;
  margin:0 10px 6px 10px;
}

.channel-skel{
  height:12px;
  width:60%;
  margin:0 10px 10px 10px;
}

/* ===== Visibility ===== */
.loaded .skeleton-wrap{
  display:none;
}
.loaded .real-content{
  display:block;
}
.real-content{
  display:none;
}
</style>
</head>

<body>

<!-- ===== Header ===== -->
<header class="header">
  <div class="logo">
    <img src="https://www.aparat.com/ui/assets/img/aparat-logo.svg">
  </div>

  <!-- Skeleton -->
  <div class="skeleton skeleton-wrap search-skel"></div>
  <!-- Real -->
  <div class="search real-content">جستجوی ویدیو در آپارات</div>

  <div class="actions">
    <!-- Skeleton -->
    <div class="skeleton skeleton-wrap btn-skel"></div>
    <div class="skeleton skeleton-wrap btn-skel"></div>
    <!-- Real -->
    <button class="btn real-content">بارگذاری</button>
    <button class="btn real-content">🔔</button>
    <button class="btn real-content">☰</button>
  </div>
</header>

<!-- ===== Videos ===== -->
<div class="container">
  <div class="videos">

    <!-- Skeleton Cards -->
    <div class="card skeleton-wrap">
      <div class="skeleton thumb-skel"></div>
      <div class="skeleton title-skel"></div>
      <div class="skeleton channel-skel"></div>
    </div>
    <div class="card skeleton-wrap">
      <div class="skeleton thumb-skel"></div>
      <div class="skeleton title-skel"></div>
      <div class="skeleton channel-skel"></div>
    </div>
    <div class="card skeleton-wrap">
      <div class="skeleton thumb-skel"></div>
      <div class="skeleton title-skel"></div>
      <div class="skeleton channel-skel"></div>
    </div>

    <!-- Real Cards -->
    <div class="card real-content">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?1">
        <span class="time">20:31</span>
      </div>
      <div class="info">
        <div class="title">سونیک کالرز آلتیمیت با مود</div>
        <div class="channel">Neo Charmy · 34 بازدید</div>
      </div>
    </div>
    <div class="card real-content">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?2">
        <span class="time">00:09</span>
      </div>
      <div class="info">
        <div class="title">رانش زمین در جاده ایذه</div>
        <div class="channel">عصر ایران · 796 بازدید</div>
      </div>
    </div>
    <div class="card real-content">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?3">
        <span class="time">11:26</span>
      </div>
      <div class="info">
        <div class="title">ارائه خانم زهرا محمدی</div>
        <div class="channel">کانال رسمی · 1 بازدید</div>
      </div>
    </div>

  </div>
</div>

<script>
setTimeout(()=>{
  document.body.classList.add("loaded");
},2000);
</script>

</body>
</html>
