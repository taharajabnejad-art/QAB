<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= BASE ================= */
body {
  margin:0;
  font-family: sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

/* نئون کناری */
.hero::before,
.hero::after {
  content:"";
  position:absolute;
  top:0;
  width:160px;
  height:100%;
  filter:blur(80px);
  opacity:.8;
}

.hero::before {
  left:-60px;
  background:#ffbe00;
}

.hero::after {
  right:-60px;
  background:#ff5c00;
}

/* ================= HEADER ================= */
.hero-header-fixed {
  position:fixed;
  top:0; right:0;
  width:100%;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:2;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url("image/logo.png") no-repeat center/contain;
}

/* ================= HERO TEXT ================= */
.hero-text {
  z-index:1;
  text-align:center;
  margin-top:80px;
}

/* ================= SKELETON ================= */
.skeleton {
  position:relative;
  overflow:hidden;
  background:#1f1f1f;
  border-radius:8px;
}

.skeleton::after {
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );
  animation:shimmer 1.6s infinite;
}

@keyframes shimmer {
  100% { transform:translateX(100%); }
}

.skeleton.loaded::after {
  display:none;
}

/* ================= TEXT SIZES ================= */
.hero-title {
  width:320px;
  height:42px;
  margin:0 auto 14px;
}

.hero-desc {
  width:260px;
  height:20px;
  margin:0 auto;
}

/* ================= REAL TEXT ================= */
.real-text {
  display:none;
}

.loaded + .real-text {
  display:block;
}

/* ================= CTA ================= */
.cta-button {
  margin-top:32px;
  background:#FFBE00;
  color:#0d0d0d;
  font-weight:700;
  padding:12px 28px;
  border-radius:6px;
  text-decoration:none;
  display:inline-block;
}
</style>
</head>

<body>

<section class="hero">

  <!-- HEADER -->
  <div class="hero-header-fixed">
    <strong>قاب</strong>
    <div class="logo-box-img"></div>
  </div>

  <!-- HERO TEXT -->
  <div class="hero-text">

    <!-- Title Skeleton -->
    <div class="skeleton hero-title"></div>
    <h1 class="real-text">داستان جهان ویدئو</h1>

    <!-- Desc Skeleton -->
    <div class="skeleton hero-desc"></div>
    <p class="real-text">جایی برای تجربه و اشتراک ویدئوها</p>

    <a class="cta-button">داستان خودتو بنویس</a>
  </div>

</section>

<script>
/* حذف اسکلتون بعد از لود */
setTimeout(() => {
  document.querySelectorAll('.skeleton').forEach(el => {
    el.classList.add('loaded');
    el.style.display = 'none';
    el.nextElementSibling.style.display = 'block';
  });
}, 2200);
</script>

</body>
</html>
