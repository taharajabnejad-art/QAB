<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#0d0d0d;
  color:#fff;
  font-family:sans-serif;
}

/* ================= SKELETON LOADING ================= */
#loading{
  position:fixed;
  inset:0;
  background:#0d0d0d;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.skeleton{
  width:90%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.block{
  position:relative;
  background:#1a1a1a;
  border-radius:14px;
  overflow:hidden;
}

/* اندازه واقعی اجزای سایت */
.block.banner{height:90px}
.block.text-sm{height:18px;width:55%}
.block.text-lg{height:18px;width:90%}
.block.video{height:170px}

/* شاین مدرن */
.block::after{
  content:'';
  position:absolute;
  top:0;
  left:-140%;
  width:60%;
  height:100%;
  background:linear-gradient(
    110deg,
    transparent 0%,
    rgba(255,255,255,0.18) 45%,
    rgba(255,255,255,0.25) 50%,
    rgba(255,255,255,0.18) 55%,
    transparent 100%
  );
  filter:blur(1px);
  animation:skeleton-shine 1.4s linear infinite;
}

@keyframes skeleton-shine{
  to{ left:140% }
}

#loading.hide{
  opacity:0;
  transition:opacity .7s ease;
  pointer-events:none;
}

/* ================= HERO ================= */
.hero{
  min-height:80vh;
  padding:32px 20px;
  background:
    linear-gradient(120deg,#FFBE00 0%,transparent 45%),
    #0d0d0d;
  opacity:0;
  transition:opacity .5s ease;
}

.hero h1{
  margin-top:140px;
  text-align:center;
  font-size:36px;
}
.hero p{
  text-align:center;
  margin-top:12px;
  opacity:.85;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div class="skeleton">
    <div class="block banner"></div>
    <div class="block text-sm"></div>
    <div class="block text-lg"></div>
    <div class="block video"></div>
  </div>
</div>

<!-- SITE -->
<section class="hero">
  <h1>داستانت رو پیدا کن</h1>
  <p>قاب، جایی برای دیدن و کشف ویدئوها</p>
</section>

<script>
window.addEventListener('load',()=>{
  const loading=document.getElementById('loading')
  const hero=document.querySelector('.hero')

  setTimeout(()=>{
    loading.classList.add('hide')
    hero.style.opacity=1
    setTimeout(()=>loading.remove(),700)
  },2000)
})
</script>

</body>
</html>
