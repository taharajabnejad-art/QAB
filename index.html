<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aparat Dark Skeleton</title>

<style>
@font-face {
    font-family: 'CustomRavi';
    src: url('data:font/woff2;base64,PUT_YOUR_BASE64_HERE') format('woff2');
    font-weight: normal;
    font-style: normal;
}

body {
    margin:0;
    font-family:'CustomRavi', sans-serif;
    background:#0f0f0f;
    color:#eaeaea;
}

/* ===== Skeleton Animation ===== */
.skeleton {
    background: linear-gradient(
        90deg,
        #1e1e1e 25%,
        #2a2a2a 37%,
        #1e1e1e 63%
    );
    background-size: 400% 100%;
    animation: shimmer 1.2s linear;
    animation-iteration-count:3; /* فقط سه بار */
    border-radius:10px;
}

@keyframes shimmer {
    0% { background-position:100% 0; }
    100% { background-position:-100% 0; }
}

/* ===== Header ===== */
.header {
    height:64px;
    background:#141414;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:12px;
    border-bottom:1px solid #222;
}

.logo img {
    height:24px; /* کوچک */
    filter:brightness(1.1);
}

.search, .search-skel {
    flex:1;
    border-radius:10px;
    padding:8px 12px;
    font-size:14px;
    display:flex;
    align-items:center;
}

.search {
    background:#1f1f1f;
    color:#aaa;
}

.actions {
    display:flex;
    gap:10px;
    align-items:center;
}

.btn, .btn-skel {
    border-radius:10px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.btn {
    border:1px solid #2a2a2a;
    background:#1a1a1a;
    color:#eee;
    font-size:14px;
}

/* ===== Videos ===== */
.container {
    padding:20px;
}

.videos {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
}

.card, .card.skeleton-wrap {
    width:260px;
    height:240px; /* thumb + info */
    display:flex;
    flex-direction:column;
    border-radius:14px;
    overflow:hidden;
    background:#141414;
}

.thumb, .thumb-skel {
    height:160px;
    width:100%;
    border-radius:12px;
    position:relative;
}

.time {
    position:absolute;
    bottom:8px;
    left:8px;
    background:#ffbe00; /* رنگ کلاسیک آپارات */
    color:#000;
    font-size:12px;
    padding:2px 6px;
    border-radius:6px;
    font-weight:bold;
}

.info {
    padding:10px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.title, .title-skel {
    height:14px;
    width:100%;
}

.channel, .channel-skel {
    height:12px;
    width:70%;
}

/* ===== Visibility ===== */
.loaded .skeleton-wrap { display:none; }
.loaded .real-content { display:block; }
.real-content { display:none; }

</style>
</head>

<body>

<!-- ===== Header ===== -->
<header class="header">
    <div class="logo">
        <img src="image/logo.png" alt="Logo">
    </div>

    <div class="skeleton skeleton-wrap search-skel"></div>
    <div class="real-content search">جستجوی ویدیو در آپارات</div>

    <div class="actions">
        <div class="skeleton skeleton-wrap btn-skel"></div>
        <div class="skeleton skeleton-wrap btn-skel"></div>

        <button class="btn real-content">بارگذاری</button>
        <button class="btn real-content">🔔</button>
        <button class="btn real-content">☰</button>
    </div>
</header>

<!-- ===== Videos ===== -->
<div class="container">
    <div class="videos">

        <!-- Skeleton Cards -->
        <div class="card skeleton-wrap">
            <div class="skeleton thumb-skel"></div>
            <div class="skeleton title-skel"></div>
            <div class="skeleton channel-skel"></div>
        </div>
        <div class="card skeleton-wrap">
            <div class="skeleton thumb-skel"></div>
            <div class="skeleton title-skel"></div>
            <div class="skeleton channel-skel"></div>
        </div>
        <div class="card skeleton-wrap">
            <div class="skeleton thumb-skel"></div>
            <div class="skeleton title-skel"></div>
            <div class="skeleton channel-skel"></div>
        </div>

        <!-- Real Cards -->
        <div class="card real-content">
            <div class="thumb">
                <img src="https://picsum.photos/500/300?1" alt="Video 1">
                <span class="time">20:31</span>
            </div>
            <div class="info">
                <div class="title">سونیک کالرز آلتیمیت با مود</div>
                <div class="channel">Neo Charmy · 34 بازدید</div>
            </div>
        </div>
        <div class="card real-content">
            <div class="thumb">
                <img src="https://picsum.photos/500/300?2" alt="Video 2">
                <span class="time">00:09</span>
            </div>
            <div class="info">
                <div class="title">رانش زمین در جاده ایذه</div>
                <div class="channel">عصر ایران · 796 بازدید</div>
            </div>
        </div>
        <div class="card real-content">
            <div class="thumb">
                <img src="https://picsum.photos/500/300?3" alt="Video 3">
                <span class="time">11:26</span>
            </div>
            <div class="info">
                <div class="title">ارائه خانم زهرا محمدی</div>
                <div class="channel">کانال رسمی · 1 بازدید</div>
            </div>
        </div>

    </div>
</div>

<script>
setTimeout(()=>{
    document.body.classList.add("loaded");
},2000);
</script>

</body>
</html>
