body{
  margin:0;
  font-family:Qab,sans-serif;
  background:#0f0f0f;
  color:#eaeaea;
}

/* ===== Shimmer ===== */
@keyframes shimmer{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}

/* ===== Header ===== */
.header{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:#141414;
  border-bottom:1px solid #222;
}

.logo img{height:24px;}

.search{
  flex:1;
  background:#1f1f1f;
  padding:8px 12px;
  border-radius:10px;
  font-weight:400;
  color:#aaa;
}

/* ===== Skeleton Overlay ===== */
.skel{
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    #1c1c1c 25%,
    #2a2a2a 37%,
    #1c1c1c 63%
  );
  background-size:400% 100%;
  animation:shimmer 2.5s linear 1;
  border-radius:4px;
  pointer-events:none;
}

.loaded .skel{display:none;}

/* ===== Grid ===== */
.container{padding:20px;}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

/* ===== Card ===== */
.card{
  background:#141414;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

/* ===== Thumb ===== */
.thumb{
  position:relative;
  height:160px;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.thumb .skel{border-radius:14px 14px 0 0;}

.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:#ffbe00;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
  font-weight:700;
}

/* ===== Info ===== */
.info{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.title-wrap,
.channel-wrap{
  position:relative;
}

/* متن واقعی */
.title{
  font-size:14px;
  font-weight:700;
  position:relative;
  color:transparent;
}

.channel{
  font-size:12px;
  color:transparent;
  font-weight:400;
  position:relative;
}

/* اسکلت متن */
.text-skel{
  position:absolute;
  inset:0;
  border-radius:4px;
}

/* اندازه اسکلت متن */
.title-wrap{height:14px;width:90%;}
.channel-wrap{height:12px;width:60%;}

/* ===== دسته بندی / تیتر ===== */
.category-title{
  font-size:24px;          /* اندازه اصلی تیتر */
  font-weight:700;
  color:#fff;
  padding:16px 20px 8px;
  position:relative;
}

.category-title .title-skel{
  position:absolute;
  inset:0;
  border-radius:4px;
  background:linear-gradient(
    90deg,
    #1c1c1c 25%,
    #2a2a2a 37%,
    #1c1c1c 63%
  );
  background-size:400% 100%;
  animation:shimmer 2.5s linear 1;  /* کندتر */
}

.category-title .title-text{
  position:relative;
  color:transparent;  /* زیر اسکلت */
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="image/logo.png">
  </div>
