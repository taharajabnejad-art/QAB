<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "Ravi";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "Ravi";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  font-family:"Ravi", sans-serif;
  background:#0d0d0d;
  color:#fff;
  overflow-x:hidden;
}

/* ================= HERO ================= */
.hero {
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px 20px;
  background:#0d0d0d;
}

/* نئون از بغل‌ها */
.hero::before,
.hero::after {
  content:"";
  position:absolute;
  top:0;
  width:160px;
  height:100%;
  filter:blur(80px);
  opacity:.8;
  pointer-events:none;
}

.hero::before {
  left:-80px;
  background:#ffbe00;
}

.hero::after {
  right:-80px;
  background:#ff6a00;
}

/* ================= HEADER ================= */
.header {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:14px 24px;
  display:flex;
  justify-content:center;
  z-index:10;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:32px;
  font-weight:700;
}

.logo-box {
  width:52px;
  height:36px;
  background:url("image/logo.png") no-repeat center/contain;
  filter:drop-shadow(0 0 8px #ffbe00);
}

/* ================= TEXT ================= */
.hero-text {
  margin-top:120px;
  max-width:700px;
}

/* متن + مستطیل */
.mask-text {
  position:relative;
  display:inline-block;
  color:#fff;
}

.mask-text.title {
  font-size:42px;
  font-weight:700;
}

.mask-text.desc {
  display:block;
  margin-top:16px;
  font-size:18px;
  font-weight:400;
  opacity:.85;
}

/* مستطیل روی متن */
.mask-text::after {
  content:"";
  position:absolute;
  inset:0;
  background:#1f1f1f;
  border-radius:10px;
  animation: maskAnim 1.6s ease-in-out 3;
}

/* حذف مستطیل */
.mask-text.reveal::after {
  display:none;
}

/* انیمیشن مستطیل */
@keyframes maskAnim {
  0%   { opacity:1; }
  50%  { opacity:.55; }
  100% { opacity:1; }
}

/* ================= CTA ================= */
.cta {
  margin-top:36px;
}

.cta a {
  background:#ffbe00;
  color:#0d0d0d;
  padding:14px 34px;
  border-radius:8px;
  font-weight:700;
  font-size:16px;
  text-decoration:none;
  display:inline-block;
  transition:transform .2s ease;
}

.cta a:hover {
  transform:translateY(-2px);
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-box"></div>
    <span>قاب</span>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <h1 class="mask-text title">داستان جهان ویدئو</h1>
    <p class="mask-text desc">جایی برای تجربه و اشتراک ویدئوها</p>

    <div class="cta">
      <a href="#">داستان خودتو بنویس</a>
    </div>
  </div>
</section>

<script>
document.querySelectorAll('.mask-text').forEach(el => {
  setTimeout(() => {
    el.classList.add('reveal');
  }, 1600 * 3);
});
</script>

</body>
</html>
