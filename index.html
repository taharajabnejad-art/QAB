<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — جهان ویدئو</title>

<style>
/* ================= FONT ================= */
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Bold.woff2") format("woff2");
  font-weight: 700;
}
@font-face {
  font-family: "MainFont";
  src: url("fonts/Ravi-Regular.woff2") format("woff2");
  font-weight: 400;
}

/* ================= RESET ================= */
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:"MainFont", sans-serif;
  background:#0d0d0d;
  color:#fff;
}

/* ================= HERO ================= */
.hero {
  min-height:80vh;
  padding:32px 20px;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* پس‌زمینه مشکی */
.hero-bg {
  position:fixed;
  inset:0;
  background:#0d0d0d;
  z-index:0;
}

/* هدر با لوگو و منو */
.hero-header-fixed {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px 20px;
  gap:20px;
  z-index:2;
}

.logo {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:36px;
  font-weight:700;
}

.logo-box-img {
  width:54px;
  height:36px;
  background:url('image/logo.png') no-repeat center/contain;
  filter:drop-shadow(0 0 5px #FFBE00);
}

/* دکمه منو */
.menu-button {
  padding:10px 16px;
  background:#FFBE00;
  border:none;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
}

/* ================= HERO TEXT ================= */
.hero-text {
  text-align:center;
  z-index:1;
  position:relative;
}

.hero-title {
  width:300px;
  height:42px;
  margin:0 auto 16px;
  border-radius:8px;
  background: rgba(255,255,255,0.05); /* مستطیل بی‌رنگ روی متن */
  position:relative;
  overflow:hidden;
}

.hero-desc {
  width:220px;
  height:18px;
  margin:0 auto;
  border-radius:6px;
  background: rgba(255,255,255,0.05);
  position:relative;
  overflow:hidden;
}

.cta-button {
  display:inline-block;
  margin-top:32px;
  padding:12px 28px;
  border-radius:6px;
  background:#FFBE00;
  color:#0d0d0d;
  font-weight:700;
  text-decoration:none;
}

/* ================= SKELETON ================= */
.skeleton::after {
  content: "";
  position: absolute;
  top:0;
  left:-150%;
  width:50%;
  height:100%;
  background: rgba(255,255,255,0.2);
  transform:rotate(25deg);
  animation: shine 1.5s linear infinite;
}

@keyframes shine {
  0% { transform: translateX(-150%) rotate(25deg); }
  50% { transform: translateX(150%) rotate(25deg); }
  100% { transform: translateX(-150%) rotate(25deg); }
}

.skeleton.loaded::after {
  display:none;
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-bg"></div>

  <div class="hero-header-fixed">
    <div class="logo">
      <div class="logo-box-img"></div>
      <span>قاب</span>
    </div>
    <button class="menu-button">منو</button>
  </div>

  <div class="hero-text">
    <div class="hero-title skeleton"></div>
    <div class="hero-desc skeleton"></div>
    <a class="cta-button">داستان جهان ویدئو</a>
    <p style="margin-top:12px;">جایی برای تجربه و اشتراک ویدئوها</p>
  </div>
</section>

<script>
window.addEventListener('load', () => {
  const skeletons = document.querySelectorAll('.skeleton');
  let count = 0;
  const maxShines = 3;
  const interval = setInterval(() => {
    count++;
    if(count >= maxShines){
      skeletons.forEach(el => el.classList.add('loaded'));
      clearInterval(interval);
    }
  }, 700); // کندتر کردن انیمیشن برای 3 بار حرکت
});
</script>

</body>
</html>
