<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aparat Dark Skeleton Overlay</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f0f0f;
  color:#eaeaea;
}

/* ===== Skeleton Overlay ===== */
.skel-overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.1) 25%,
    rgba(255,255,255,0.2) 37%,
    rgba(255,255,255,0.1) 63%
  );
  background-size:400% 100%;
  animation: shimmer 1.2s linear 3; /* فقط سه بار */
  border-radius:inherit;
  pointer-events:none;
}

@keyframes shimmer{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}

/* ===== Header ===== */
.header{
  height:64px;
  background:#141414;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  border-bottom:1px solid #222;
}

.logo img{
  height:24px;
  filter:brightness(1.1);
}

.search{
  flex:1;
  background:#1f1f1f;
  border-radius:10px;
  padding:8px 12px;
  color:#aaa;
  font-size:14px;
  font-weight:400;
}

.actions{display:flex;gap:10px;}
.btn{
  border:1px solid #2a2a2a;
  background:#1a1a1a;
  color:#eee;
  border-radius:10px;
  padding:6px 10px;
  cursor:pointer;
}

/* ===== Videos ===== */
.container{padding:20px;}
.videos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

.card{
  background:#141414;
  border-radius:14px;
  overflow:hidden;
  position:relative; /* برای اسکلت Overlay */
}

.thumb{position:relative;}
.thumb img{width:100%;display:block;border-radius:14px 14px 0 0;}

.time{
  position:absolute;
  bottom:8px;
  left:8px;
  background:#ffbe00;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:6px;
  font-weight:bold;
}

.info{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.title{
  font-size:14px;
  font-weight:700;
  height:14px;
  width:90%;
  position:relative;
}

.channel{
  font-size:12px;
  color:#999;
  font-weight:400;
  height:12px;
  width:60%;
  position:relative;
}

/* برای اسکلت Overlay روی متن‌ها */
.title .skel-overlay, .channel .skel-overlay{
  border-radius:4px;
}

/* لوگو کوچک */
.logo{
  width:100px;
  display:flex;
  align-items:center;
}

/* مخفی شدن اسکلت بعد لود */
.loaded .skel-overlay{
  display:none;
}
</style>
</head>

<body>

<!-- ===== Header ===== -->
<header class="header">
  <div class="logo">
    <img src="image/logo.png">
  </div>

  <div class="search">
    جستجوی ویدیو در آپارات
    <div class="skel-overlay"></div>
  </div>

  <div class="actions">
    <button class="btn">بارگذاری</button>
    <button class="btn">🔔</button>
    <button class="btn">☰</button>
  </div>
</header>

<!-- ===== Videos ===== -->
<div class="container">
  <div class="videos">

    <!-- کارت 1 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?1">
        <span class="time">20:31</span>
        <div class="skel-overlay"></div>
      </div>
      <div class="info">
        <div class="title">
          سونیک کالرز آلتیمیت با مود
          <div class="skel-overlay"></div>
        </div>
        <div class="channel">
          Neo Charmy · 34 بازدید
          <div class="skel-overlay"></div>
        </div>
      </div>
    </div>

    <!-- کارت 2 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?2">
        <span class="time">00:09</span>
        <div class="skel-overlay"></div>
      </div>
      <div class="info">
        <div class="title">
          رانش زمین در جاده ایذه
          <div class="skel-overlay"></div>
        </div>
        <div class="channel">
          عصر ایران · 796 بازدید
          <div class="skel-overlay"></div>
        </div>
      </div>
    </div>

    <!-- کارت 3 -->
    <div class="card">
      <div class="thumb">
        <img src="https://picsum.photos/500/300?3">
        <span class="time">11:26</span>
        <div class="skel-overlay"></div>
      </div>
      <div class="info">
        <div class="title">
          ارائه خانم زهرا محمدی
          <div class="skel-overlay"></div>
        </div>
        <div class="channel">
          کانال رسمی · 1 بازدید
          <div class="skel-overlay"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// شبیه‌سازی لود محتوا
setTimeout(()=>{
  document.body.classList.add("loaded");
},2000);
</script>

</body>
</html>
