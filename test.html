<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header Center Logo</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: IRANSans, sans-serif;
}

/* بک تست */
body{
  background:url("https://picsum.photos/1400/900") center/cover no-repeat;
  min-height:200vh;
}

/* ===== HEADER ===== */
.header{
  position:fixed;
  top:0;
  right:0;
  width:100%;
  height:80px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:1000;
  position:relative;

  /* گرادینت */
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,1) 0%,
    rgba(0,0,0,0.6) 40%,
    rgba(0,0,0,0.25) 70%,
    rgba(0,0,0,0) 100%
  );

  transition:background .3s ease;
}

.header.scrolled{
  background:#000;
}

/* ===== LEFT & RIGHT ===== */
.left,
.right{
  display:flex;
  align-items:center;
  gap:14px;
  z-index:2;
}

/* همبرگری */
.menu-icon{
  font-size:22px;
  color:#fff;
  cursor:pointer;
}

/* آواتار */
.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1.5px solid #fff;
}

/* ===== LOGO (CENTER ABSOLUTE) ===== */
.logo{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  font-size:18px;
  font-weight:700;
  white-space:nowrap;
}

.logo-mark{
  width:18px;
  height:18px;
  border:2px solid #fff;
}

/* ===== DESKTOP ===== */
.menu{
  display:flex;
  gap:18px;
}

.menu a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  opacity:.9;
}

.menu a:hover{opacity:1}

/* ===== MOBILE ===== */
@media (max-width:768px){
  .header{height:64px}
  .menu{display:none}
  .avatar{width:30px;height:30px}
  .logo{font-size:17px}
}

/* فاصله محتوا */
.spacer{height:80px}
@media (max-width:768px){.spacer{height:64px}}
</style>
</head>

<body>

<header class="header" id="header">

  <!-- راست -->
  <div class="right">
    <div class="menu-icon">☰</div>
    <nav class="menu">
      <a href="#">فیلم</a>
      <a href="#">سریال</a>
      <a href="#">ایرانی</a>
    </nav>
  </div>

  <!-- لوگو وسط واقعی -->
  <div class="logo">
    <div class="logo-mark"></div>
    <span>فیلیمو</span>
  </div>

  <!-- چپ -->
  <div class="left">
    <div class="avatar"></div>
  </div>

</header>

<div class="spacer"></div>

<script>
const header = document.getElementById("header");
window.addEventListener("scroll",()=>{
  header.classList.toggle("scrolled",window.scrollY>20);
});
</script>

</body>
</html>۸
