<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My PWA</title>

<!-- لینک manifest.json -->
<link rel="manifest" href="manifest.json">

<!-- رنگ نوار بالا در موبایل -->
<meta name="theme-color" content="#0d0d0d">

<!-- CSS داخلی -->
<style>
  /* کل بدنه */
  body {
    margin: 0;
    font-family: sans-serif;
    background-color: #0d0d0d;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
  }

  /* متن اصلی */
  h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
    text-align: center;
  }

  /* دکمه نصب */
  #installBtn {
    padding: 0.7rem 1.5rem;
    font-size: 1rem;
    background-color: #1a1a1a;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 10px;
    cursor: pointer;
  }

  #installBtn:hover {
    background-color: #fff;
    color: #0d0d0d;
  }

  /* لودینگ ساده */
  #splash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
  }

  #splash img {
    width: 150px;
    height: 150px;
    margin-bottom: 1rem;
  }

  #splash span {
    font-size: 1.2rem;
    color: #ccc;
  }
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <img src="image/logo.png" alt="Logo">
  <span>در حال بارگذاری...</span>
</div>

<!-- محتوای اصلی PWA -->
<h1>سلام، این یک PWA است!</h1>
<button id="installBtn" style="display:none;">نصب اپ</button>

<!-- JS داخلی -->
<script>
  // حذف splash بعد از لود
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('installBtn').style.display = 'inline-block';
    }, 1500); // 1.5 ثانیه لودینگ
  });

  // PWA Install
  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const choiceResult = await deferredPrompt.userChoice;
      if (choiceResult.outcome === 'accepted') {
        console.log('کاربر اپ را نصب کرد.');
      }
      deferredPrompt = null;
    }
  });
</script>

</body>
</html>
