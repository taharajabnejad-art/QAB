<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWA iOS Only</title>

<!-- Manifest PWA -->
<link rel="manifest" href="manifest-pwa.json">

<!-- iOS PWA Support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QAB">
<link rel="apple-touch-icon" href="image/InShot_20260107_104806241.png">

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
  }

  #add-to-home {
    display: none; /* پیش‌فرض پنهان */
    padding: 12px 24px;
    background-color: #007aff;
    color: white;
    border-radius: 12px;
    text-align: center;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    z-index: 999;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>سلام! این PWA فقط برای iOS Safari هست 😎</h1>

<div id="add-to-home">
  برای نصب روی صفحه اصلی روی گزینه Share و سپس "Add to Home Screen" بزنید 📲
</div>

<script>
  // تشخیص iOS
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  // تشخیص Safari
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

  if (isIOS && isSafari) {
    document.getElementById("add-to-home").style.display = "block";
  }
</script>

</body>
</html>
