<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebApp</title>

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest-pwa.json">

  <!-- Apple Touch Icon شفاف برای iOS -->
  <link rel="apple-touch-icon" href="transparent-icon.png">

  <!-- رنگ پس‌زمینه برای iOS Splash -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000; /* پس‌زمینه سیاه */
      color: #ffffff; /* رنگ متن سفید */
      font-family: sans-serif;
      text-align: center;
    }
    a {
      color: #00ff00; /* رنگ لینک دلخواه */
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div>
    <h1>Example Domain</h1>
    <p>This domain is for use in documentation examples without needing permission. Avoid use in operations.</p>
    <p><a href="https://iana.org/domains/example" target="_blank">Learn more</a></p>
  </div>
</body>
</html>
