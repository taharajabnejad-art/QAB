<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
    font-family: sans-serif;
  }

  /* هدر ثابت */
  .header {
    height: 64px;
    background: #ffffff;
    border-radius: 32px; /* گوشه‌ها کاملاً دایره‌ای */
    margin-bottom: 20px;
  }

  /* اسکرول افقی */
  .scroll-container {
    display: flex;
    overflow-x: auto;
    gap: 16px;
    padding-bottom: 10px;
  }

  /* کارت‌ها / چی‌کی‌ها */
  .card {
    min-width: 120px;
    height: 120px;
    background: #ffffff;
    border-radius: 60px; /* نصف ارتفاع → گوشه‌ها دایره‌ای */
    flex-shrink: 0;
  }

  .scroll-container::-webkit-scrollbar {
    display: none; /* مخفی کردن اسکرول بار ugly */
  }
</style>
</head>
<body>

  <!-- هدر -->
  <header class="header"></header>

  <!-- چی‌کی‌ها -->
  <div class="scroll-container">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>

</body>
</html>
