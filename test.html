<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebApp</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest-pwa.json">
  
  <!-- Apple Touch Icon شفاف برای iOS -->
  <link rel="apple-touch-icon" href="transparent-icon.png">
  
  <!-- رنگ پس‌زمینه برای iOS Splash -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body style="margin:0; background-color:#000000; color:#000000; display:flex; align-items:center; justify-content:center; height:100vh;">

  <!-- متن اولیه هم‌رنگ با پس‌زمینه → دیده نمیشه -->
  <div style="color:#000000;">
    Loading...
  </div>

  <!-- سایت یا WebView ساده -->
  <iframe src="https://example.com" style="border:none; width:100%; height:100%;"></iframe>

</body>
</html>
