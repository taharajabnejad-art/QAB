<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Header</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: IRANSans, sans-serif;
}

/* بک فقط برای تست */
body{
  background:url("https://picsum.photos/1400/900") center/cover no-repeat;
  min-height:200vh;
}

/* ===== HEADER ===== */
.header{
  position:fixed;
  top:0;
  right:0;
  width:100%;
  height:80px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:1000;
  transition:background .3s ease;

  /* دسکتاپ: گرادینت افقی از راست */
  background:linear-gradient(
    to left,
    rgba(0,0,0,1) 0%,
    rgba(0,0,0,.7) 35%,
    rgba(0,0,0,.3) 65%,
    rgba(0,0,0,0) 100%
  );
}

/* اسکرول */
.header.scrolled{
  background:#000;
}

/* ===== DESKTOP ===== */
.right{
  display:flex;
  align-items:center;
  gap:32px;
}

/* لوگو */
.logo{
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  font-size:20px;
  font-weight:700;
}

.logo-mark{
  width:18px;
  height:18px;
  border:2px solid #fff;
}

/* منو */
.menu{
  display:flex;
}

.menu a{
  color:#fff;
  text-decoration:none;
  margin-right:18px;
  font-size:14px;
  opacity:.9;
}
.menu a:hover{opacity:1}

/* چپ (فقط یک چیز) */
.left{
  display:flex;
  align-items:center;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1.5px solid #fff;
}

/* همبرگر */
.menu-icon{
  display:none;
  font-size:22px;
  color:#fff;
  cursor:pointer;
}

/* ===== MOBILE ===== */
@media (max-width:768px){

  .header{
    height:64px;
    padding:0 16px;

    /* موبایل: گرادینت عمودی */
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,1) 0%,
      rgba(0,0,0,.6) 45%,
      rgba(0,0,0,0) 100%
    );
  }

  /* منوی دسکتاپ مخفی */
  .menu{
    display:none;
  }

  /* همبرگر فقط موبایل */
  .menu-icon{
    display:block;
  }

  /* لوگو وسط واقعی */
  .logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:18px;
  }

  .avatar{
    width:30px;
    height:30px;
  }
}

/* فاصله محتوا */
.spacer{height:80px}
@media (max-width:768px){.spacer{height:64px}}
</style>
</head>

<body>

<header class="header" id="header">

  <!-- راست: لوگو ← منو (RTL) -->
  <div class="right">
    <div class="logo">
      <div class="logo-mark"></div>
      <span>فیلیمو</span>
    </div>

    <nav class="menu">
      <a href="#">فیلم</a>
      <a href="#">سریال</a>
      <a href="#">ایرانی</a>
      <a href="#">خارجی</a>
    </nav>

    <!-- همبرگر فقط موبایل -->
    <div class="menu-icon">☰</div>
  </div>

  <!-- چپ: فقط یک آیتم -->
  <div class="left">
    <div class="avatar"></div>
  </div>

</header>

<div class="spacer"></div>

<script>
const header = document.getElementById("header");
window.addEventListener("scroll",()=>{
  header.classList.toggle("scrolled",window.scrollY > 20);
});
</script>

</body>
</html>
