<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0f0f0f; /* رنگ صفحه */
    font-family: sans-serif;
  }

  /* هدر ثابت کمی روشن‌تر */
  .header {
    height: 64px;
    background: #1a1a1a; /* کمی روشن‌تر از پس‌زمینه */
    border-radius: 32px; /* گوشه‌های دایره‌ای */
    margin-bottom: 20px;
  }

  /* اسکرول افقی */
  .scroll-container {
    display: flex;
    overflow-x: auto;
    gap: 16px;
    padding-bottom: 10px;
  }

  /* کارت‌ها / چی‌کی‌ها */
  .card {
    min-width: 120px;
    height: 120px;
    background: #1a1a1a; /* کارت‌ها هم هم‌رنگ هدر */
    border-radius: 60px; /* گوشه‌های کاملاً دایره‌ای */
    flex-shrink: 0;
  }

  /* مخفی کردن اسکرول بار */
  .scroll-container::-webkit-scrollbar {
    display: none;
  }
</style>
</head>
<body>

  <!-- هدر -->
  <header class="header"></header>

  <!-- چی‌کی‌ها / کارت‌ها -->
  <div class="scroll-container">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>

</body>
</html>
