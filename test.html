<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Text Skeleton Overlay</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0d0d;
      font-family: sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    /* ===== TEXT WRAPPER ===== */
    .text-wrap {
      position: relative;
      display: inline-block;
    }

    .real-text {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.2;
    }

    .small {
      font-size: 22px;
      font-weight: 500;
      opacity: 0.9;
    }

    /* ===== OVERLAY RECTANGLE ===== */
    .text-mask {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      pointer-events: none;
    }

    /* ===== SHIMMER ===== */
    .shimmer {
      background: linear-gradient(
        100deg,
        #2a2a2a 30%,
        #3a3a3a 50%,
        #2a2a2a 70%
      );
      background-size: 400%;
      animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer {
      from {
        background-position: 100% 0;
      }
      to {
        background-position: 0 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="text-wrap">
      <span class="real-text">به سایت ما خوش آمدید</span>
      <span class="text-mask shimmer"></span>
    </div>

    <div class="text-wrap">
      <span class="real-text small">جدیدترین فیلم‌ها و سریال‌ها</span>
      <span class="text-mask shimmer"></span>
    </div>

    <div class="text-wrap">
      <span class="real-text small">پخش آنلاین با بهترین کیفیت</span>
      <span class="text-mask shimmer"></span>
    </div>

  </div>

  <script>
    const masks = document.querySelectorAll(".text-mask");
    let count = 0;

    const interval = setInterval(() => {
      count++;

      if (count === 3) {
        masks.forEach(mask => mask.remove());
        clearInterval(interval);
      }
    }, 2000);
  </script>

</body>
</html>
