<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube iOS 26 Clone</title>

<!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json">

<!-- سبک‌ها -->
<link rel="stylesheet" href="/test.css">

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => console.log('Service Worker Registered'));
}
</script>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <input placeholder="جستجوی ویدیو ...">
  <button>🔍</button>
</div>

<!-- Video Feed -->
<div class="video-list">
  <div class="video-card">
    <img src="https://via.placeholder.com/400x225" alt="Thumbnail">
    <div class="video-info">
      <img src="https://via.placeholder.com/38" alt="Avatar">
      <div class="text">
        <div class="title">ویدیو نمونه با UI شیشه‌ای</div>
        <div class="channel">کانال طراحی • 2M بازدید</div>
      </div>
    </div>
  </div>
  <div class="video-card">
    <img src="https://via.placeholder.com/400x225" alt="Thumbnail">
    <div class="video-info">
      <img src="https://via.placeholder.com/38" alt="Avatar">
      <div class="text">
        <div class="title">ویدیو دوم با Dark Mode</div>
        <div class="channel">کانال نمونه • 500K بازدید</div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Tab Bar -->
<div class="tab-bar">
  <button class="active">🏠<span>خانه</span></button>
  <button>🔥<span>ترند</span></button>
  <button>➕<span>آپلود</span></button>
  <button>📺<span>اشتراک‌ها</span></button>
  <button>📚<span>کتابخانه</span></button>
</div>

</body>
</html>
