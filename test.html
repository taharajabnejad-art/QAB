<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاب — Skeleton</title>

<style>
/* ================= FONT (Base64 Example) ================= */
@font-face {
  font-family: "Ravi";
  font-weight: 700;
  src: url(data:font/woff2;base64,PUT_YOUR_BASE64_HERE) format("woff2");
}
@font-face {
  font-family: "Ravi";
  font-weight: 400;
  src: url(data:font/woff2;base64,PUT_YOUR_BASE64_HERE) format("woff2");
}

body {
  margin: 0;
  background: #0d0d0d;
  font-family: "Ravi", sans-serif;
  color: #fff;
}

/* ================= HERO ================= */
.hero {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}

/* نئون بغل‌ها */
.hero::before,
.hero::after {
  content: "";
  position: absolute;
  top: 0;
  width: 220px;
  height: 100%;
  filter: blur(120px);
  opacity: 0.35;
}

.hero::before {
  left: -100px;
  background: #ffbe00;
}

.hero::after {
  right: -100px;
  background: #ff006a;
}

/* ================= TEXT WRAPPER ================= */
.hero-text {
  position: relative;
  z-index: 2;
  text-align: center;
}

/* ================= SKELETON BASE ================= */
.skeleton {
  position: relative;
  overflow: hidden;
  background: #1f1f1f;
  border-radius: 8px;
}

/* انیمیشن داخلی (همونی که می‌خواستی) */
.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,0.25) 50%,
    transparent 100%
  );
  animation: shimmer 1.6s infinite;
}

@keyframes shimmer {
  100% {
    transform: translateX(100%);
  }
}

/* ================= HERO SKELETON TEXT ================= */
.hero-title-skeleton {
  width: 320px;
  height: 46px;
  margin: 0 auto 16px;
}

.hero-desc-skeleton {
  width: 260px;
  height: 20px;
  margin: 0 auto;
  border-radius: 6px;
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-text">
    <div class="skeleton hero-title-skeleton"></div>
    <div class="skeleton hero-desc-skeleton"></div>
  </div>
</section>

</body>
</html>
